<!doctype html><html lang="ja"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>触って覚える！ 血液検査マスター</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
/* 「触って覚える！」シリーズの見た目。こどもの人工呼吸器トレーニング・手技マスター（ポップのテーマ）に合わせる。
   丸ゴシック・クリームの地・太い紺の輪郭線・下側の厚み（リップ）・症例ごとの色の帯。ライトテーマ固定。 */
:root{
  color-scheme:light;
  --body:#FFF3E4;
  --deck:linear-gradient(168deg,#FFEFD6 0%,#FFE0EC 46%,#E3ECFF 100%);
  --sheet:#FFFFFF; --panel2:#FFF8EE;
  --ink:#262745; --ink-2:#55577A; --ink-3:#767898; --faint:#A4A6C2; --line:#F0DFD0;
  --accent:#FF5E8A; --accent-t:#D63A6C; --accent-soft:#FFF0F4;
  --blue:#5B7CFA; --blue-soft:#EEF2FF;
  --blood:#E0334F; --blood-soft:#FFECEF;
  --ok:#0B8F66; --ok-soft:#E8FBF3; --ok-br:#9FE9CE; --warn:#B86A00; --warn-soft:#FFF4DE;
  --hi:#E0334F; --lo:#3557D6;
  --gline:#2E2545; --glip:#C3B4D6;
  --chap:#5B7CFA;
  --band-ped:#BDEFD9; --band-ad:#E3DAFA; --band-ad-line:#8B6BFF;
  --s1:#12A8A0; --s2:#F0A800;
  --cap-edta:#8B6BFF; --cap-cit:#4FA8FF; --cap-sst:#E8A317; --cap-naf:#9AA0AE; --cap-gas:#12C48B; --cap-bc:#FF8A3D;
  --whole:#8E1428; --cells:#A3162E; --serum:#FFD873; --serum-hemo:#F0607A; --gel:#EEF1F6; --glass:#F7F4FC;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"Barlow Semi Condensed","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --f-logo:"Dela Gothic One","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  --r:18px;
}
[data-chap="0"]{--chap:#FF5E8A} [data-chap="1"]{--chap:#FF8A3D} [data-chap="2"]{--chap:#4FA8FF} [data-chap="3"]{--chap:#8B6BFF} [data-chap="4"]{--chap:#12C48B} [data-chap="scope"]{--chap:#5B7CFA}
*{box-sizing:border-box}
html{background:var(--body)}
html,body{min-height:100%;max-width:100%;overflow-x:hidden}@supports(overflow:clip){html,body{overflow-x:clip}}img,svg,video,canvas{max-width:100%}
body{margin:0;background:var(--deck) fixed;background-color:var(--body);color:var(--ink);font:500 15px/1.7 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;touch-action:manipulation}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-weight:800;text-wrap:balance;margin:0;line-height:1.35}
p{margin:0}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.mono,.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
.note{font-size:12.5px;color:var(--ink-3);line-height:1.6}
.small{font-size:13px}
.muted{color:var(--ink-3)}

/* 輪郭線＋厚みの板 */
.sheet{background:var(--sheet);border:3px solid var(--gline);border-radius:var(--r);box-shadow:0 4px 0 var(--glip);padding:16px}
.sheet h2{font-size:17.5px}
.stack{display:flex;flex-direction:column;gap:12px}
.sec{padding-top:16px;display:flex;flex-direction:column;gap:16px}

.sndbtn{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid var(--gline);box-shadow:0 3px 0 var(--glip);cursor:pointer;padding:0}
.sndbtn:active{transform:translateY(3px);box-shadow:none}
.sndbtn svg{width:20px;height:20px}
.sndbtn[aria-pressed="false"]{background:#F1EEF6}

/* ---------- タイトル ---------- */
.title{position:fixed;inset:0;z-index:90;display:grid;place-items:center;overflow:auto;
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:#FFF1E4 url("assets/img/bg_title_bloodtest.webp") center/cover no-repeat}
.title::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(255,248,238,.30) 0%,rgba(255,240,244,.55) 55%,rgba(255,243,228,.85) 100%);pointer-events:none}
.title[hidden]{display:none}
.tstage{position:relative;width:min(440px,100%);display:flex;flex-direction:column;align-items:center;gap:10px}
.tlogo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:4px;text-align:center}
.tlogo .series{font:400 clamp(34px,10.5vw,50px)/1.1 var(--f-logo);color:#fff;letter-spacing:.02em;
  -webkit-text-stroke:7px var(--gline);paint-order:stroke fill;text-shadow:0 5px 0 rgba(46,37,69,.35);white-space:nowrap}
.tlogo .series .k1{color:#FFC53D}.tlogo .series .k2{color:#FF7FA4}.tlogo .series .k3{color:#4FD8B4}.tlogo .series .k4{color:#7FA0FF}
.tlogo .name{display:inline-block;font:800 clamp(20px,6vw,26px)/1.2 var(--f-body);color:#fff;letter-spacing:.12em;
  background:linear-gradient(180deg,#FF6B7F,#E0334F);border:3px solid var(--gline);border-radius:999px;padding:5px 22px 6px;
  box-shadow:0 4px 0 rgba(46,37,69,.3);text-shadow:0 2px 0 rgba(46,37,69,.45)}
.tlogo .tag{font-size:12px;font-weight:800;color:var(--ink-2);background:rgba(255,255,255,.88);border-radius:999px;padding:2px 12px}
.tcast{display:flex;align-items:flex-end;justify-content:center;width:100%;height:clamp(150px,27vh,230px);position:relative}
.tcast img{display:block;height:100%;width:auto;filter:drop-shadow(0 8px 10px rgba(60,30,80,.28))}
.tcast .tm{height:58%;margin-right:-14px;transform:translateY(-22%) rotate(-4deg);animation:puku 3.6s ease-in-out infinite}
.tcast .ttubes{height:62%;width:auto;margin-left:-6px;filter:drop-shadow(0 6px 8px rgba(60,30,80,.22))}
@keyframes puku{0%,100%{transform:translateY(-22%) rotate(-4deg) scale(.95)}45%{transform:translateY(-24%) rotate(-4deg) scale(1.05)}}
.tsay{position:relative;font-size:13.5px;line-height:1.6;font-weight:700;color:var(--ink);text-align:center;background:#fff;
  border:3px solid var(--gline);border-radius:18px;padding:9px 14px;max-width:100%;box-shadow:0 4px 0 rgba(46,37,69,.22)}
.tsay::after{content:"";position:absolute;left:52%;top:-10px;width:14px;height:14px;background:#fff;border-left:3px solid var(--gline);border-top:3px solid var(--gline);transform:rotate(45deg)}
.tmenu{display:flex;flex-direction:column;gap:9px;width:100%;margin-top:4px}
.tbtn{display:flex;align-items:center;gap:12px;text-align:left;padding:9px 14px 9px 9px;border-radius:20px;width:100%;
  background:#fff;border:3px solid var(--gline);box-shadow:0 5px 0 var(--glip);color:var(--ink);cursor:pointer;transition:transform .06s,box-shadow .06s}
.tbtn:active{transform:translateY(5px);box-shadow:none}
.tbtn img{flex:none;width:44px;height:44px}
.tbtn b{display:block;font-size:16px;font-weight:800;line-height:1.3}
.tbtn i{display:block;font-style:normal;font-size:12px;color:var(--ink-3);font-weight:700}
.tbtn.go{background:linear-gradient(180deg,#FFC24D,#FF8A3D);box-shadow:0 5px 0 #C4560F;color:#fff}
.tbtn.go b{text-shadow:0 2px 0 rgba(46,37,69,.4)} .tbtn.go i{color:#FFF4E4}
.tfoot{display:flex;align-items:center;gap:10px;width:100%;margin-top:4px;background:rgba(255,255,255,.9);border:3px solid var(--gline);border-radius:999px;padding:5px 5px 5px 14px}
.tprog{flex:1;height:12px;border-radius:999px;background:#F3E6EC;overflow:hidden;border:2px solid var(--gline)}
.tprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FF5E8A,#FFB020 45%,#12C48B)}
.tpct{font:700 15px var(--f-num);color:var(--ink-2);min-width:3.6em;text-align:right}
@media(max-height:680px){.tcast{height:120px}.tsay{display:none}.tbtn{padding:6px 12px 6px 7px}.tbtn img{width:36px;height:36px}.tbtn i{display:none}}

/* ---------- モーダル ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(50,30,60,.42);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadein .16s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.mbox{background:#fff;width:min(520px,100%);max-height:88%;overflow:auto;border:4px solid var(--gline);border-radius:26px;box-shadow:0 10px 0 rgba(46,37,69,.18),0 26px 60px rgba(80,40,90,.35);animation:pop .2s cubic-bezier(.2,1.3,.5,1)}
@keyframes pop{from{transform:scale(.94) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.mhead{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(180deg,#FF7FA4,#F0507F);border-bottom:4px solid var(--gline)}
.mhead h3{flex:1;color:#fff;font-size:17px;text-shadow:0 2px 0 rgba(46,37,69,.45)}
.mhead button{padding:5px 14px;border-radius:999px;background:#fff;border:3px solid var(--gline);font-weight:800;font-size:13px;box-shadow:0 3px 0 rgba(46,37,69,.35);cursor:pointer}
.mbody{padding:16px;background:linear-gradient(180deg,#FFF9F3,#FFF1F5);font-size:14px}
.mbody p{margin:0 0 10px}

/* ---------- 演出 ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:120;overflow:hidden}
#fx i{position:absolute;width:9px;height:14px;border-radius:2px;animation:fall 1.5s cubic-bezier(.2,.6,.5,1) forwards}
@keyframes fall{0%{transform:translate3d(0,0,0) rotate(0);opacity:1}100%{transform:translate3d(var(--dx),var(--dy),0) rotate(var(--rot));opacity:0}}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:130;pointer-events:none;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 32px);
  background:linear-gradient(135deg,#FF5E8A,#FFB020);color:#fff;font-weight:800;font-size:15px;line-height:1.35;border:3px solid var(--gline);
  padding:6px 18px 6px 6px;border-radius:999px;box-shadow:0 10px 30px rgba(190,60,110,.35);animation:toast 2.2s ease-out forwards;text-shadow:0 2px 0 rgba(46,37,69,.35)}
.toast .tface{width:44px;height:44px;border-radius:50%;background:#E8FBF3;overflow:hidden;flex:none;border:2px solid var(--gline)}
.toast .tface img{display:block;width:100%;height:100%;object-fit:cover}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-10px) scale(.98)}}
.puku{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:110;width:92px;pointer-events:none;
  filter:drop-shadow(0 6px 8px rgba(60,30,80,.28));animation:pukuIn 1.6s cubic-bezier(.2,1.3,.5,1) forwards}
.puku img{display:block;width:100%;height:auto}
@keyframes pukuIn{0%{opacity:0;transform:translateY(40px) scale(.7)}14%{opacity:1;transform:none}82%{opacity:1;transform:none}100%{opacity:0;transform:translateY(16px) scale(.92)}}

/* ---------- いぶき先生の吹き出し ---------- */
.coach{display:flex;gap:10px;align-items:flex-start}
.cav{flex:none;width:46px;height:46px;border-radius:50%;overflow:hidden;background:#E8FBF3;border:3px solid var(--gline);box-shadow:0 3px 0 var(--glip)}
.cav img{display:block;width:100%;height:100%;object-fit:cover}
.cbub{position:relative;flex:1;min-width:0;background:var(--panel2);border:2.5px solid var(--gline);border-radius:16px;padding:8px 12px 9px;font-size:14px;line-height:1.7}
.cbub::before{content:"";position:absolute;left:-9px;top:14px;width:12px;height:12px;background:var(--panel2);border-left:2.5px solid var(--gline);border-bottom:2.5px solid var(--gline);transform:rotate(45deg)}
.cwho{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.04em;color:var(--chap);margin-bottom:1px}
.cwho i{font-style:normal;color:#fff;background:var(--chap);border-radius:999px;padding:0 8px;font-size:10.5px}
.coach.ok .cbub,.coach.ok .cbub::before{background:var(--ok-soft)}
.coach.ng .cbub,.coach.ng .cbub::before{background:var(--blood-soft)}
.coach.ok .cwho{color:var(--ok)} .coach.ng .cwho{color:var(--blood)}

/* ---------- 症例の画面のヘッダー ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#fff;border-bottom:3px solid var(--gline);box-shadow:0 4px 0 rgba(46,37,69,.12)}
.top::before{content:"";display:block;height:5px;background:var(--chap)}
.top .wrap{padding-block:8px 10px;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;gap:8px}
.back{flex:none;border:3px solid var(--gline);background:#fff;border-radius:999px;padding:3px 12px 3px 9px;color:var(--ink);font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 3px 0 var(--glip)}
.back:active{transform:translateY(3px);box-shadow:none}
.bar h1{font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{flex:none;font:700 12px/1 var(--f-num);letter-spacing:.04em;padding:5px 9px;border-radius:999px;background:var(--chap);color:#fff;border:2px solid var(--gline)}
.stepper{display:flex;gap:5px}
.stepper i{flex:1;height:10px;border-radius:999px;background:#F3E6EC;border:2px solid var(--gline)}
.stepper i.done{background:var(--chap)}
.stepper i.now{background:#FFC53D}
.stephead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stepno{font:700 13px var(--f-num);color:#fff;background:var(--chap);border:2px solid var(--gline);border-radius:999px;padding:1px 10px;letter-spacing:.04em}
.stephead h2{font-size:20px}

/* ---------- ホーム ---------- */
.home-hero{position:relative;margin-top:14px;padding:14px 120px 14px 16px;background:#fff;border:3px solid var(--gline);border-radius:22px;box-shadow:0 5px 0 var(--glip);overflow:hidden;min-height:150px}
.home-hero .eyebrow{font:400 15px/1.2 var(--f-logo);color:var(--accent-t);letter-spacing:.02em}
.home-hero h1{font-size:27px;margin-top:2px}
.home-hero p{color:var(--ink-2);margin:6px 0 0;font-size:13.5px;line-height:1.6}
.home-hero .hdoc{position:absolute;right:6px;bottom:-34px;height:190px;width:auto;pointer-events:none}
.hrow{display:flex;gap:8px;margin-top:10px;align-items:center}
.hbtn{border:3px solid var(--gline);background:var(--panel2);border-radius:999px;padding:3px 14px;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 3px 0 var(--glip)}
.hbtn:active{transform:translateY(3px);box-shadow:none}
.bigprog{display:flex;align-items:center;gap:10px;margin-top:10px}
.bigprog .bar2{flex:1;height:16px;border-radius:999px;background:#fff;border:3px solid var(--gline);overflow:hidden}
.bigprog .bar2 i{display:block;height:100%;background:linear-gradient(90deg,#FF5E8A,#FFB020 45%,#12C48B)}
.bigprog .pct{font:700 18px var(--f-num);flex:none}
.cat{margin-top:22px}
.cat h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;color:#fff;background:var(--chap);border:3px solid var(--gline);border-radius:16px;padding:7px 12px;box-shadow:0 4px 0 rgba(46,37,69,.22);margin-bottom:10px;text-shadow:0 1px 0 rgba(46,37,69,.35)}
.cat h2 .cdot{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--gline);flex:none}
.cat h2 .ccount{margin-left:auto;font:700 12px/1.4 var(--f-num);color:var(--chap);background:#fff;border:2px solid var(--gline);border-radius:999px;padding:0 9px;text-shadow:none}
.list{display:flex;flex-direction:column;gap:9px}
.item{display:flex;align-items:center;gap:11px;padding:10px 12px 10px 10px;background:var(--sheet);border:3px solid var(--gline);border-left:8px solid var(--chap);box-shadow:0 4px 0 var(--glip);border-radius:16px;text-align:left;width:100%;cursor:pointer;transition:transform .06s,box-shadow .06s}
.item:active{transform:translateY(4px);box-shadow:none}
.item .ic{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--chap) 14%,#fff);border:2px solid var(--gline)}
.item .tx{flex:1;min-width:0}
.item b{display:block;font-size:15px;font-weight:800;line-height:1.4}
.item small{display:block;color:var(--ink-3);font-size:12px;line-height:1.5;font-weight:700}
.item.done{background:linear-gradient(90deg,rgba(43,217,160,.14),#fff 70%)}
.pill{font:700 12px var(--f-num);padding:3px 9px;border-radius:99px;border:2px solid var(--gline);color:var(--ink-2);white-space:nowrap;background:#fff}
.pill.go{background:var(--chap);color:#fff}
.stars{font-size:15px;letter-spacing:1px;color:#FFB020;-webkit-text-stroke:.6px var(--gline)}
.stars .off{color:#EFE6F2}

/* ---------- ボタン ---------- */
.btn{border:3px solid var(--gline);background:#fff;color:var(--ink);border-radius:999px;padding:8px 18px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--glip);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.solid{background:linear-gradient(180deg,#FFC24D,#FF8A3D);color:#fff;box-shadow:0 4px 0 #C4560F;text-shadow:0 2px 0 rgba(46,37,69,.4)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:2.5px solid var(--gline);background:#fff;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 var(--glip)}
.chip[aria-pressed="true"]{background:var(--chap);color:#fff}

/* ---------- 問診 ---------- */
.pt{display:flex;gap:12px;align-items:center}
.avatar{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--chap) 16%,#fff);border:3px solid var(--chap);font:800 26px var(--f-body);color:var(--chap)}
.pt b{display:block;font-size:18px;font-weight:800;line-height:1.25}
.pt span{font-size:12.5px;color:var(--ink-3);font-weight:700}
.story{padding:9px 12px;border-radius:14px;background:#FFF3DA;border:2px solid #FFC85C;font-size:14px;line-height:1.7}
.story i{display:block;font-style:normal;font-size:10.5px;font-weight:800;color:#9A6400}
.vitals{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.vital{padding:6px 10px;border-radius:12px;background:var(--panel2);border:2px solid var(--line)}
.vital span{display:block;font-size:10.5px;color:var(--ink-3);font-weight:800}
.vital b{font:700 18px/1.2 var(--f-num)}
.find{margin:0;padding-left:1.2em;font-size:13.5px;color:var(--ink-2)}
.lbl{font-size:12.5px;font-weight:800;color:var(--ink)}

/* ---------- 採血オーダー ---------- */
.tests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.test{display:flex;gap:8px;align-items:flex-start;text-align:left;border:2.5px solid var(--gline);background:#fff;border-radius:14px;padding:8px 10px;cursor:pointer;box-shadow:0 3px 0 var(--glip);min-width:0}
.test:active{transform:translateY(3px);box-shadow:none}
.test .dot{flex:0 0 14px;height:20px;border-radius:4px 4px 7px 7px;margin-top:2px;background:var(--cap);border:2px solid var(--gline)}
.test b{display:block;font-size:13px;line-height:1.35;font-weight:800}
.test span{display:block;font-size:10.5px;color:var(--ink-3);font-weight:700;line-height:1.35}
.test[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}

る凝固反応の基質で、血小板が凝集する際の補因子（cofactor）としても欠かせない。肝臓でつくられ、およそ8割が血管の中、2割が組織にあり、半減期は2〜4日である。","high":"炎症：川崎病、膠原病、感染症など／侵襲のあと：外傷後、手術後など／その他：悪性腫瘍、ネフローゼ症候群、糖尿病","low":"生まれつき：先天性フィブリノゲン異常症、先天性無（低）フィブリノゲン血症／肝臓でつくれない：慢性肝炎・肝硬変などの重い肝障害、L-アスパラギナーゼ投与中／使われる・失われる：DIC、大量の出血、巨大血管腫、巨大な血栓症など","note":"年齢別表はなく本文中の記載のみ（小児は新生児の値だけ）。データ：ネルソン小児科学 第17版。小児の測定：トロンビン凝固時間法。成人値の測定法：凝固時間測定法。補足：この方法だと、ヘパリンが混ざった検体やフィブリノゲン異常症では本当の値より低く出る。","ser":{},"other":[{"sex":"男女","age":"新生児","lo":125,"hi":300,"mid":null}],"adult":[{"sex":"男女","lo":150,"hi":400}],"adultText":"成人 150〜400mg/dL"},"at3":{"abbr":"AT-III","name":"アンチトロンビンIII","unit":"%","page":28,"desc":"凝固を抑える代表的な因子で、分子量約6.5万の糖蛋白として肝臓と血管内皮でつくられる。働きが落ちると固まりやすくなり、血栓ができやすい。","high":null,"low":"つくれない：肝障害、L-アスパラギナーゼ投与中／体外へ漏れる：ネフローゼ症候群、熱傷など／使い果たす：DIC、血栓症など、敗血症／生まれつき：AT-III欠乏症、AT-III異常症","note":"年齢別表はなく本文中の記載のみ。データ：ネルソン小児科学 第17版。測定：発色性合成基質法（活性%で表示）。","ser":{},"other":[{"sex":"男女","age":"小児","lo":80,"hi":120,"mid":null}],"adult":[{"sex":"男女","lo":79,"hi":121}],"adultText":"成人 79〜121%"},"fdp":{"abbr":"FDP","name":"フィブリン/フィブリノゲン分解産物","unit":"μg/mL","page":30,"desc":"プラスミンがフィブリンやフィブリノゲンを分解してできた断片をまとめて呼ぶ名称である。線溶が亢進していないかを拾い上げる検査で、DICや血栓症を診断するうえで重要である。","high":"血栓・凝固の病態：血栓症、DIC、心筋梗塞／治療・侵襲：ウロキナーゼやt-PAによる線溶療法の後、手術後、熱傷など／その他の病気：悪性腫瘍、肝障害／たまった血液や液体が吸収されるとき：血腫・胸水・腹水／異常フィブリノゲン血症","low":null,"note":"小児と成人を分けておらず、年齢別表もない。基準値は解説冒頭に示された4μg/mL以下。測定：ラテックス免疫比濁法。","ser":{},"other":[],"adult":[],"adultText":"基準値 FDP: 4μg/mL以下（ラテックス免疫比濁法、小児・成人の区別なし）"},"ddimer":{"abbr":"D-dimer","name":"Dダイマー","unit":"μg/mL","page":30,"desc":"架橋で安定化したフィブリンをプラスミンが分解してできた産物の総称である。FDPと通常は並行して動き、両者がそろって上がっていれば主として二次線溶、Dダイマーは上がらずFDPのみ高い場合は一次線溶の亢進を考える。","high":"血栓・凝固の病態：血栓症、DIC、心筋梗塞／治療・侵襲：ウロキナーゼやt-PAによる線溶療法の後、手術後、熱傷など／その他の病気：悪性腫瘍、肝障害","low":null,"note":"小児と成人を分けておらず、年齢別表もない。基準値は解説冒頭に示された1.0μg/mL未満（上限のみ）。測定：ラテックス免疫比濁法。","ser":{},"other":[],"adult":[],"adultText":"基準値 Dダイマー: 1.0μg/mL未満（ラテックス免疫比濁法、小児・成人の区別なし）"},"tp":{"abbr":"TP","name":"総蛋白","unit":"g/dL","page":34,"desc":"血清に含まれる蛋白は100種を超え、アルブミン・グロブリン・凝固因子などがその 2.6,6.15],[2.6,6.1],[2.6,6.1],[2.65,6.1],[2.7,6.1],[2.75,6.15],[2.8,6.2],[2.85,6.25],[2.87,6.3],[2.9,6.32],[2.9,6.35],[2.9,6.4],[2.9,6.45],[2.9,6.5],[2.9,6.5],[2.9,6.5]]},"other":[],"adult":[{"sex":"男","lo":3.7,"hi":7.0},{"sex":"女","lo":2.5,"hi":7.0}],"adultText":null},"urine_chem":{"abbr":"尿中生化学検査","name":"尿中生化学検査（β2MG・α1MG・NAG・尿蛋白・尿中Na/K/Ca/P・尿酸）","unit":null,"page":60,"desc":"腎機能をみるための尿検査項目をまとめたもので、年齢別の基準値表はない。尿細管が傷むと、β2MG・α1MG・NAGが尿中へ多く出てくる。評価には、尿蛋白は対Cr比（尿蛋白/Cr比）、CaもCa/Cr比、Pは%TRP、Na・K・尿酸はそれぞれの排泄率（順にFENa、FEK、FEUA）を使う。","high":"β2MG（尿細管の障害）：Fanconi症候群、間質性腎炎、急性尿細管壊死、上部尿路感染症、低形成腎、移植腎、特発性尿細管性蛋白尿／β2MG（腎全体）：腎機能が落ちたとき／β2MG（腎前性に増える）：感染症、腫瘍、自己免疫性疾患","low":"β2MGは酸性尿（pH6.0以下）では壊れて失活するため、見かけ上低く出る","note":"年齢別の表はなく、本文の数値のみ。尿中β2MG：通常の上限はおよそ300μg/L（ただし新生児や未熟児なら1,000μg/Lを超えても病的とは限らない）。蛋白尿：尿蛋白/Cr比0.2以上を有意とする。FEUA：基準6〜12%。計算式：いずれも各物質のクリアランスをCrクリアランスで割って100を掛けた%値（FENaはNa、FEKはK、FEUAはUAのクリアランスを用いる）。","ser":{},"other":[],"adult":[],"adultText":"尿中β2MG 通常300μg/L程度まで；尿蛋白/Cr比 0.2以上で有意；FEUA 6〜12%"},"tc":{"abbr":"TC","name":"総コレステロール","unit":"mg/dL","page":62,"desc":"細胞膜をつくり、ステロイドホルモンや胆汁酸の原料にもなる必須の脂質である。血漿中ではおもにLDLとHDLの粒子に乗って運ばれ、動脈硬化リスクの指標として的確に読むことが求められる。","high":"遺伝性：家族性高コレステロール血症／内分泌・代謝：甲状腺機能低下症、糖尿病／腎臓：ネフローゼ症候群","low":"内分泌：甲状腺中毒症／肝臓：肝硬変","note":"データ：国立成育医療研究センター（男女共通の下限・上限）。測定法：コレステロール酸化酵素法。補足：乳児期は低めに出るが、母乳栄養児ではまれに高値となり断乳で正常に戻ることがある。1歳を過ぎると年齢による変動は小さい。米国小児科学会AAPのガイドライン（Pediatrics 2011）による区分はTCで許容<170・境界170～199・上昇≧200 mg/dL、LDL-Cで<110・110～129・≧130。","ser":{"男女":[[109,218],[113,225],[115,227],[118,230],[120,232],[122,235],[124,238],[125,240],[127,241],[128,243],[128,244],[128,245],[126,247],[125,247],[125,240],[125,235],[125,230],[125,230],[125,230],[125,230],[125,230],[125,230],[125,230],[125,230],[125,230],[125,230],[125,230],[125,230],[125,230],[125,230],[125,230],[125,230]]},"other":[],"adult":[{"sex":"男女","lo":150,"hi":219}],"adultText":"男女とも TC：150～219 mg/dL（コレステロール脱水素酵素法［UV法］）"},"ldl_c":{"abbr":"LDL-C","name":"LDL-コレステロール","unit":"mg/dL","page":62,"desc":"肝臓でつくられたコレステロールを全身の組織へ届ける役割をもつ。値が高いほど血管の壁へのコレステロール沈着が進み、心血管疾患の危険が高まる。","high":"リスク上昇：動脈硬化、心血管疾患","low":null,"note":"年齢ごとの表はない。小児の基準として本文には上限のみ「<170mg/dL」が示される。AAPガイドラインでは110未満を許容、110～129を境界、130以上を上昇とする（mg/dL）。10歳以上で食事療法を行っても下がらない場合の薬物療法の目安は、他の心血管リスクがなければ>190、あれば>160、川崎病後の冠動脈瘤・糖尿病・末期慢性腎不全では≧130 mg/dL。","ser":{},"other":[{"sex":"男女","age":"小児","lo":null,"hi":170,"mid":null}],"adult":[],"adultText":"動脈硬化性疾患予防ガイドライン2013（空腹時採血）：LDL-C 140mg/dL以上で高LDL-C血症、120～139mg/dLで境界域"},"hdl_c":{"abbr":"HDL-C","name":"HDL-コレステロール","unit":"mg/dL","page":62,"desc":"組織に余ったコレステロールを回収して肝臓へ戻す働きをもつ。少ないと脳梗塞や虚血性心疾患が起こりやすくなる。","high":null,"low":"リスク上昇：脳梗塞、虚血性心疾患","note":"年齢ごとの表はない。小児の基準として本文には下限のみ「>40mg/dL」が示される。","ser":{},"other":[{"sex":"男女","age":"小児","lo":40,"hi":null,"mid":null}],"adult":[],"adultText":"動脈硬化性疾患予防ガイドライン2013（空腹時採血）：HDL-C 40mg/dL未満で低HDL-C血症"},"t_bil":{"abbr":"T-Bil","name":"総ビリルビン","unit":"mg/dL","page":64,"desc":"ヘム蛋白（大部分はヘモグロビン）が壊れてできる色素である。まず間接型として血液中に出て、肝臓でグルクロン酸と結合（抱合）されて直接型となり、胆汁へ排泄される。","high":"新生児・乳児期：Lucey-Driscoll症候群、新生児黄疸、胆道閉鎖症／肝臓の病気：肝炎、肝硬変／赤血球の破壊：溶血性貧血／体質性黄疸：Gilbert症候群・Crigler-Najjar症候群・Dubin-Johnson症候群・Rotor症候群","low":null,"note":"データ：国立成育医療研究センター（男女共通の下限・上限）。測定法：酵素法。補足：明らかに高いときは直接・間接の分画も確認する。","ser":{"男女":[[0.4,3.2],[0.25,2.3],[0.15,1.35],[0.13,0.8],[0.12,0.62],[0.11,0.6],[0.11,0.59],[0.11,0.59],[0.12,0.59],[0.12,0.59],[0.13,0.59],[0.14,0.59],[0.16,0.67],[0.23,0.8],[0.25,0.85],[0.25,0.85],[0.25,0.85],[0.25,0.85],[0.25,0.85],[0.25,0.85],[0.25,0.9],[0.25,0.95],[0.25,1.0],[0.25,1.1],[0.25,1.2],[0.25,1.25],[0.25,1.3],[0.25,1.35],[0.25,1.4],[0.25,1.4],[0.25,1.4],[0.25,1.4]]},"other":[],"adult":[{"sex":"男女","lo":0.3,"hi":1.2}],"adultText":"男女とも 0.3～1.2 mg/dL（化学酸化法）"},"glu":{"abbr":"血糖","name":"血糖","unit":"mg/dL","page":66,"desc":"血漿に含まれるD-グルコースの濃度を指す。ブドウ糖はすべての細胞、なかでも脳にとって欠かせない燃料であり、その血中濃度は厳密にコントロールされている。","high":"インスリン作用の不足：糖尿病／インスリン抵抗性：感染症など／治療に関連：急速なブドウ糖投与（医原性）、糖質コルチコイド・L-アスパラギナーゼなどの薬剤","low":"エネルギー供給不足：長時間の絶食、糖原病／ホルモンの異常：急性副腎不全、重症GH分泌不全、乳児のインスリン過剰症／幼児期に多い：ケトン性低血糖","note":"年齢ごとの表はない。測定法：ヘキソキナーゼUV法。補足：高値側は成人と共通の基準で判断する。低値側は小児で40mg/dL未満、新生児で30mg/dL未満を確実な低血糖とみなす。","ser":{},"other":[{"sex":"男女","age":"新生児","lo":30,"hi":null,"mid":null},{"sex":"男女","age":"小児","lo":40,"hi":null,"mid":null}],"adult":[],"adultText":"科学的根拠に基づく糖尿病診療ガイドライン2013：空腹時血糖（静脈血漿値）110mg/dL未満を正常域、126mg/dL以上を糖尿病域。随時血糖200mg/dL以上を糖尿病域。"},"hba1c":{"abbr":"HbA1c","name":"ヘモグロビンA1c","unit":"%","page":68,"desc":"HbAのβ鎖がグルコースと結合（糖化）した割合を示す。直近1～2か月の血糖の平均的な高さを映すので、一度の採血で高血糖の傾向をつかめる。","high":"診断：糖尿病（NGSPで6.5%以上なら糖尿病型）／平均血糖より高めに出る状態：鉄欠乏、急速に良くなった糖尿病","low":"低血糖が持続する病態（高インスリン血性低血糖症など）／平均血糖より低めに出る状態：赤血球寿命や産生の変化（輸血・失血後、溶血、腎性貧血でエリスロポエチン治療中）、肝硬変、急に発症・悪化した糖尿病","note":"年齢ごとの表はない。測定法：LA法（ラテックス凝集法）。補足：小児でも成人と同一の基準を用いる。HbFが多い新生児期は値が低めになる点に注意。NGSP値によるコントロール評価は、6.2未満が優、6.2～6.9未満が良、可は6.9～7.4未満（不十分）と7.4～8.4未満（不良）、不可8.4以上。","ser":{},"other":[],"adult":[{"sex":"男女","lo":4.6,"hi":6.2}],"adultText":"男女とも 4.6～6.2%（NGSP）（JDS 4.3～5.8%）"},"na":{"abbr":"Na","name":"ナトリウム","unit":"mEq/L","page":70,"desc":"細胞外液に最も多い陽イオンで、血漿浸透圧の大部分を決めている。細胞外液の量そのものがNaによって保たれているため、血清濃度が体内のNa総量をそのまま表すわけではない。","high":"水がNaより多く失われる：嘔吐・下痢による高張性脱水、尿崩症、不感蒸泄の増加、本態性高Na血症、浸透圧利尿／Naの取り込み過多：原発性アルドステロン症・Cushing症候群による再吸収亢進、Naの過剰投与","low":"水が過剰になる：SIADH、低張液の入れすぎ、水中毒、心不全、腎不全、肝硬変、ネフローゼ症候群、甲状腺機能低下症／Naが水より多く失われる：腎・内分泌性（CSWS、利尿薬、副腎不全・Addison病、偽性低アルドステロン症、Na喪失性腎炎、Bartter症候群2型）、消化管・その他（嘔吐、下痢、イレウス、膵炎、熱傷）","note":"データ：国立成育医療研究センター（男女共通の下限・上限）。測定法：イオン選択電極（希釈）法。","ser":{"男女":[[134.9,142.7],[134.9,142.8],[134.9,142.8],[134.9,142.8],[134.9,142.8],[134.9,142.9],[134.9,142.9],[134.9,142.9],[134.9,143.0],[135.0,143.0],[135.0,143.0],[135.0,143.0],[135.0,143.0],[135.3,143.3],[135.8,143.5],[136.0,143.8],[136.3,144.0],[136.5,144.0],[136.8,144.0],[137.0,144.0],[137.3,144.0],[137.7,144.0],[138.0,144.0],[138.0,144.0],[138.0,144.0],[138.0,144.0],[138.0,144.0],[138.0,144.0],[138.0,144.0],[138.0,144.0],[138.0,144.0],[138.0,144.0]]},"other":[],"adult":[{"sex":"男女","lo":136,"hi":147}],"adultText":"男女とも 136～147 mEq/L（電極法）"},"cl":{"abbr":"Cl","name":"クロール","unit":"mEq/L","page":72,"desc":"細胞外液の陰イオンで最も多く、全体の約60%を占める。Naが上がるか重炭酸イオンが減ると高Cl血症に、Naが下がるか重炭酸イオンなど他の陰イオンが増えると低Cl血症に傾く。","high":"Naの上昇に連動：高Na血症／重炭酸イオンの減少（anion gapが正常な代謝性アシドーシス）：尿細管性アシドーシス、下痢、炭酸脱水酵素阻害剤、塩類喪失型副腎性器症候群","low":"Naの低下に連動：低Na血症／代謝性アルカローシス：くり返す嘔吐、先天性クロール下痢症、胃液の持続吸引、Gitelman症候群・Bartter症候群、ミルクアルカリ症候群／他の陰イオン増加（anion gap開大の代謝性アシドーシス）：腎不全、乳酸アシドーシス、糖尿病性ケトアシドーシス、中毒／その他：輸血、メイロン投与、呼吸性アシドーシス","note":"データ：国立成育医療研究センター（男女共通の下限・上限）。測定法：イオン選択電極（希釈）法。","ser":{"男女":[[101.2,110.9],[101.1,110.8],[101.0,110.7],[101.0,110.6],[100.9,110.5],[100.9,110.4],[100.8,110.3],[100.7,110.2],[100.6,110.2],[100.6,110.2],[100.5,110.2],[100.6,110.2],[100.8,110.2],[101.0,110.0],[101.0,110.0],[101.0,110.0],[101.0,110.0],[101.0,110.0],[101.0,109.8],[101.3,109.5],[101.7,109.3],[102.0,109.0],[102.0,109.0],[102.0,109.0],[102.0,109.0],[102.0,109.0],[102.0,109.0],[102.0,109.0],[102.0,109.0],[102.0,109.0],[102.0,109.0],[102.0,109.0]]},"other":[],"adult":[{"sex":"男女","lo":98,"hi":109}],"adultText":"男女とも 98～109 mEq/L（電極法）"},"k":{"abbr":"K","name":"カリウム","unit":"mEq/L","page":74,"desc":"細胞内液の中心となる陽イオンで、体内量の98%が細胞の中にある。血清濃度を左右するのは、摂取量、腎臓・腸管からの排泄、細胞内外のシフトの三つである。","high":"見かけ上の上昇（偽性高K血症）：採血時の溶血、白血球・血小板増多、家族性偽性高K血症／体内への負荷：輸血、K製剤、溶血、横紋筋融解症、熱傷、消化管出血／排泄が減る：腎不全、2型Bartter症候群、Addison病・副腎皮質過形成、偽性低アルドステロン症、薬剤性／細胞外へのシフト：インスリン欠乏、アシドーシス、ジギタリス中毒、βブロッカー","low":"入ってこない：飢餓、神経性食思不振症／腸から失う：下痢、下剤乱用、吸収不良／尿から失う：利尿薬やステロイドなどの薬剤、尿細管性アシドーシス、Cushing症候群、Bartter症候群・Gitelman症候群・Liddle症候群、アルドステロン過剰の病態／細胞内へのシフト：アルカローシス、インスリン投与、β2刺激薬、低K血症性周期性四肢麻痺","note":"データ：国立成育医療研究センター（男女共通の下限・上限）。測定法：イオン選択電極（希釈）法。","ser":{"男女":[[4.08,6.02],[4.2,5.9],[4.18,5.72],[4.1,5.6],[4.02,5.53],[4.0,5.45],[3.95,5.4],[3.9,5.33],[3.85,5.25],[3.83,5.2],[3.8,5.1],[3.75,5.08],[3.64,5.05],[3.6,4.9],[3.6,4.8],[3.6,4.75],[3.6,4.7],[3.6,4.7],[3.6,4.7],[3.6,4.7],[3.6,4.7],[3.6,4.7],[3.6,4.7],[3.6,4.7],[3.62,4.7],[3.68,4.7],[3.7,4.7],[3.7,4.7],[3.7,4.7],[3.7,4.7],[3.7,4.7],[3.7,4.7]]},"other":[],"adult":[{"sex":"男女","lo":3.6,"hi":5.0}],"adultText":"男女とも 3.6～5.0 mEq/L（電極法）"},"ca":{"abbr":"Ca","name":"カルシウム","unit":"mg/dL","page":76,"desc":"細胞の興奮や膜を介した能動輸送に欠かせない。40～50%はアルブミンに結合しており、生理作用をもつのはイオン化Caである。調節役は副甲状腺ホルモンとビタミンDであるため、評価は必ずリンとセットで行い、アルブミン値や酸塩基平衡による影響も考慮する。","high":"ホルモン：甲状腺機能亢進症、副甲状腺機能亢進症／骨からCaが溶け出す：長期臥床、骨折、腫瘍の骨転移／腫瘍・肉芽腫など：悪性腫瘍、サルコイドーシス／先天性：Williams症候群／薬：サイアザイド系利尿薬、ビタミンD","low":"副甲状腺の異常：偽性副甲状腺機能低下症、副甲状腺機能低下症／ビタミンDが効かない：ビタミンD依存症I型・II型、ビタミンDの摂取不足／腎臓：慢性腎不全、尿細管障害／その他：Ca摂取不足、高リン血症、薬剤性／新生児特有：仮死、母体の糖尿病や副甲状腺機能亢進症","note":"データ：国立成育医療研究センター（男女共通の下限・上限）。測定法：OCPC法。補足：Albが4g/dL未満なら「実測Ca＋4.0－Alb」を補正Caとする。","ser":{"男女":[[9.0,11.02],[9.0,11.01],[8.99,11.0],[8.98,10.99],[8.98,10.98],[8.98,10.97],[8.98,10.97],[8.97,10.95],[8.95,10.93],[8.93,10.9],[8.91,10.89],[8.87,10.84],[8.81,10.64],[8.79,10.45],[8.77,10.32],[8.75,10.28],[8.74,10.24],[8.73,10.23],[8.73,10.2],[8.73,10.18],[8.73,10.14],[8.73,10.13],[8.72,10.1],[8.72,10.08],[8.72,10.05],[8.72,10.05],[8.72,10.03],[8.72,10.03],[8.72,10.03],[8.7,10.03],[8.7,10.03],[8.7,10.03]]},"other":[],"adult":[{"sex":"男女","lo":8.5,"hi":10.2}],"adultText":"男女とも 8.5～10.2 mg/dL（アルセナゾIII法）"},"ip":{"abbr":"IP","name":"無機リン","unit":"mg/dL","page":78,"desc":"体内のリンには有機型と無機型があり、検査で測るのは無機リン（IP）である。Caと同様、副甲状腺ホルモン等が腸・骨・腎で量を調節しており、血清値を最も強く決めるのは近位尿細管での再吸収である。","high":"排泄低下：副甲状腺機能低下症、慢性腎不全／細胞が壊れて放出：腫瘍崩壊症候群、横紋筋融解症、挫滅症候群、溶血／薬：ビタミンD","low":"骨・くる病関連：家族性低リン血症性ビタミンD抵抗性くる病、くる病、骨軟化症／腎での喪失：原発性副甲状腺機能亢進症、Fanconi症候群／腸から吸収されない：ビタミンD欠乏、吸収不良症候群／細胞内への移動など：アルカローシス、糖尿病、高カロリー輸液","note":"データ：国立成育医療研究センター（男女共通の下限・上限）。測定法：酵素法。補足：溶血すると高く出るので、採血後に検体を長く置かない。","ser":{"男女":[[5.0,7.7],[4.8,7.5],[4.6,7.3],[4.48,7.1],[4.38,6.95],[4.27,6.8],[4.18,6.7],[4.1,6.63],[4.01,6.58],[3.95,6.5],[3.9,6.41],[3.9,6.4],[3.86,6.23],[3.8,6.0],[3.8,5.9],[3.85,5.8],[3.9,5.8],[3.9,5.8],[3.9,5.8],[3.85,5.8],[3.8,5.8],[3.75,5.8],[3.7,5.8],[3.6,5.8],[3.5,5.8],[3.33,5.7],[3.2,5.5],[3.08,5.3],[2.9,5.1],[2.8,4.9],[2.8,4.8],[2.8,4.7]]},"other":[],"adult":[{"sex":"男女","lo":2.4,"hi":4.3}],"adultText":"男女とも 2.4～4.3 mg/dL（モリブデン酸直接法）"},"fe":{"abbr":"Fe","name":"血清鉄","unit":"μg/dL","page":80,"desc":"ヘモグロビンの材料となる元素で、貧血の鑑別に欠かせない。体内の鉄は約2/3が赤血球に、約1/3がフェリチンなどの形で貯蔵されており、血清中にあるのは3mgほどにすぎず、その全量がトランスフェリンに結合している。","high":"造血の障害：巨赤芽球性貧血、再生不良性貧血、鉄芽球性貧血、急性白血病、赤芽球癆／鉄の過剰：ヘモクロマトーシス／肝臓：急性肝炎など","low":"鉄が足りない：潜在性鉄欠乏、鉄欠乏性貧血／炎症・慢性疾患：感染症、膠原病、悪性腫瘍／その他：真性多血症","note":"データ：日本公衆衛生協会（男女別の下限・上限）。測定法：バソフェナンスロリン直接法。補足：表は生後1か月から始まり0か月はない。男子は17歳まで、女子は18歳までで、男子18歳は空欄。朝に高く夕方に下がる日内変動がある。小児は成人より低く個人差も大きい。15歳以降は女子のほうが男子よりやや低い。","ser":{"男":[null,[60,174],[28,118],[23,107],[24,109],[21,103],[20,100],[19,98],[19,98],[20,100],[21,103],[24,110],[19,148],[19,150],[20,151],[20,153],[21,156],[21,159],[23,165],[24,169],[26,174],[27,180],[29,186],[31,193],[33,200],[35,206],[38,213],[40,220],[43,227],null,null,null],"女":[null,[55,176],[26,139],[14,114],[13,110],[13,111],[12,109],[12,108],[11,107],[11,106],[11,107],[11,107],[13,137],[14,144],[16,150],[17,153],[19,159],[20,163],[22,167],[23,170],[24,174],[25,177],[25,177],[26,177],[26,178],[25,175],[23,172],[23,170],[22,169],[22,167],null,null]},"other":[],"adult":[{"sex":"男","lo":54,"hi":200},{"sex":"女","lo":48,"hi":154}],"adultText":"男 54～200、女 48～154 μg/dL（ニトロソ-PSAP法）"},"fer":{"abbr":"FER","name":"フェリチン","unit":"ng/mL","page":82,"desc":"分子量45万の鉄を貯える蛋白で、肝臓・脾臓・膵臓・心臓・骨髄に多く含まれる。血中濃度は体の貯蔵鉄量の目安となり、1ng/mLがおよそ貯蔵鉄8mgに当たる。ただし感染症や悪性腫瘍などがあると、鉄の蓄えと無関係に値が上がる。","high":"炎症：感染症、肝炎、膵炎、炎症性疾患／腫瘍・血液：ランゲルハンス組織球症、血球貪食症候群、悪性腫瘍、白血病／鉄の蓄積：ヘモジデローシス、ヘモクロマトーシス","low":"鉄が足りない：潜在性鉄欠乏・鉄欠乏性貧血","note":"データ：日本公衆衛生協会（男女別の下限・上限、1～17歳のみで乳児の行はない）。測定法：RIA（2抗体法）。補足：小児は男女とも成人女性程度の値にとどまり、潜在的な鉄欠乏がうかがわれる。","ser":{"男":[null,null,null,null,null,null,null,null,null,null,null,null,[7.4,86],[7.8,90],[8.1,94],[8.5,97],[8.9,101],[9.1,103],[9.1,104],[9.1,104],[9.1,104],[8.7,99],[8.6,99],[8.7,99],[8.6,98],[8.5,97],[8.8,101],[9.7,110],[11.4,126],null,null,null],"女":[null,null,null,null,null,null,null,null,null,null,null,null,[7.8,113],[7.7,112],[7.6,111],[7.4,109],[7.1,107],[6.6,102],[6.2,99],[5.9,96],[5.7,94],[5.1,88],[4.7,84],[4.3,81],[3.7,74],[3.2,68],[2.9,65],[2.8,63],[2.7,62],null,null,null]},"other":[],"adult":[{"sex":"男","lo":39.4,"hi":340},{"sex":"女","lo":3.6,"hi":114}],"adultText":"男 39.4～340、女 3.6～114 ng/mL（CLEIA）"},"u_iodine":{"abbr":"尿中ヨード","name":"尿中ヨード（ヨウ素、沃度）","unit":"μg（μg/gCr）","page":84,"desc":"ヨードは足りなくても多すぎても甲状腺機能の異常を招く。摂ったヨードの大部分は尿へ出るので、尿中排泄量で摂取状況を正確に推し量れる。甲状腺機能異常の背景にヨード摂取の偏りが疑われるときに測る。","high":"摂りすぎ：妊娠中に母親が摂りすぎると胎児・新生児に甲状腺腫、高TSH血症、甲状腺機能低下、授乳中の母親が摂りすぎると乳児に甲状腺機能異常／成人での用途：無痛性甲状腺炎とバセドウ病の鑑別","low":"不足：ヨードが欠乏して起こる甲状腺機能低下（完全経腸栄養の患者でとくに注意）","note":"データ形式：男女共通のパーセンタイル表（5・25・50・75・95）。lo＝5th、hi＝95th、mid＝中央値で、p25とp75も保持。単位表記は「μg（μg/gCr）」。6～12歳と12～15歳はμg/gCr値を括弧で併記しper_gCrに保持、新生児（日齢0・5・30）には括弧値がない。測定法：Sandell-Kolthoff反応を使う比色定量（化学定量法）を改良したAPDA法。出典：Fuse Y, et al: Thyroid 2007、布施養善 他：成長科学協会研究年報 2011, 2014。補足：6～15歳の部分尿のヨード濃度は、性・年齢・身長・体重・BMI・甲状腺容積のいずれとも相関しない。WHOなどの集団評価は尿中ヨード中央値（μg/L）で行い、20未満は重度、20～49は中等度、50～99は軽度の欠乏、100～199は適切、200～299は適量以上、300以上は過剰とする。","ser":{"男女":[null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,[92.5,3400,281.6],[92.5,3400,281.6],[92.5,3400,281.6],[92.5,3400,281.6],[92.5,3400,281.6],[92.5,3400,281.6],[59.7,1783,230],[59.7,1783,230],[59.7,1783,230],[59.7,1783,230],null,null,null,null,null]},"other":[{"sex":"男女","age":"日齢0","lo":26.4,"hi":371.6,"mid":109.0},{"sex":"男女","age":"日齢5","lo":71.0,"hi":1660.0,"mid":225.0},{"sex":"男女","age":"日齢30","lo":57.8,"hi":2516.0,"mid":256.0}],"adult":[],"adultText":"日本人については設定がない。"},"crp":{"abbr":"CRP","name":"C反応性蛋白","unit":"mg/dL","page":88,"desc":"炎症が起こると真っ先に血中へ現れる急性期蛋白で、名前は肺炎球菌C多糖体に結合する性質に由来する。アミノ酸206個のサブユニットが5つ集まった構造をとる。","high":"感染：急性の感染症（急激に上がる）／組織の傷害：手術後、急性の組織障害（急激に上がる）／免疫の病気：膠原病、血管炎。※半減期は6〜19時間で、赤沈と比べて動きが速く感度も高い。","low":null,"note":"データ：日本公衆衛生協会（単位はmg/dLへ換算）。測定法：ネフェロメトリー。成人ではラテックス免疫比濁法を用いる。補足：示すのは上限のみで性別ごと。1〜11か月の値は男女で共通。女児の値は17歳までで、18・19歳はデータなし。新生児には高感度CRP（0.01mg/dLまで検出可）を使う。","ser":{"男":[null,[null,0.36],[null,0.51],[null,0.72],[null,0.87],[null,1.15],[null,1.41],[null,1.26],[null,1.23],[null,0.98],[null,0.83],[null,0.72],[null,0.85],[null,1.15],[null,1.55],[null,2.34],[null,2.95],[null,3.63],[nul 協会。測定法：ラテックス凝集免疫測定法（成人は免疫比濁法）。補足：上下限とも男女で共通。","ser":{"男女":[null,[41,86],[43,90],[45,94],[46,97],[47,100],[48,101],[48,101],[49,104],[49,102],[49,103],[49,103],[58,107],[59,109],[60,111],[61,113],[61,115],[62,116],[62,117],[62,117],[62,116],[62,115],[61,114],[60,112],[60,111],[59,109],[58,107],[57,105],[56,104],[56,102],[55,101],null]},"other":[],"adult":[{"sex":"男女","lo":86,"hi":160}],"adultText":"男女とも 86〜160 (mg/dL)（免疫比濁法）"},"c4":{"abbr":"C4","name":"補体第4成分","unit":"mg/dL","page":93,"desc":"補体の第4成分を測る検査である。補体全体のしくみはCH50の項で説明している。","high":"値が動く代表例：全身性エリテマトーデス／凝固・ショック：エンドトキシンショック・播種性血管内凝固症候群 など。解釈は出典書籍p.91の表を参照。","low":"解釈：高値と同様、出典書籍p.91の表を用いる。","note":"データ：日本公衆衛生協会。測定法：ラテックス凝集免疫測定法（成人は免疫比濁法）。補足：上下限とも男女で共通。","ser":{"男女":[null,[10,35],[11,39],[11,43],[12,46],[12,49],[12,51],[13,52],[12,51],[12,50],[12,50],[12,49],[14,46],[14,48],[15,50],[15,52],[16,54],[16,55],[16,54],[16,53],[15,51],[15,49],[14,47],[14,46],[14,46],[14,46],[14,46],[14,47],[14,47],[14,48],[14,48],null]},"other":[],"adult":[{"sex":"男女","lo":17,"hi":45}],"adultText":"男女とも 17〜45 (mg/dL)（免疫比濁法）"},"iga":{"abbr":"IgA","name":"免疫グロブリンA","unit":"mg/dL","page":94,"desc":"胎生16〜20週ごろ脾臓にリンパ球が出現すると、IgM、続いてIgGの産生が始まる。IgAはそれより遅く、IgDとともに胎生30週から作られるようになる。","high":"腎・血管：IgA腎症、アレルギー性紫斑病／感染：長く続く慢性感染症／先天性免疫異常：Wiskott-Aldrich症候群。","low":"先天的な欠損：IgA欠損症／乳児期に一時的なもの：乳児一過性低ガンマグロブリン血症。","note":"データ：日本公衆衛生協会。測定法：ラテックス凝集免疫測定法（成人は免疫比濁法）。補足：上下限を性別ごとに示す。1〜3か月は下限が設定されていない（「−」、null扱い）。女児は18歳までで19歳はデータなし。分泌型IgAは通常の検査対象に含まれない。","ser":{"男":[null,[null,24],[null,28],[null,33],[6,39],[7,44],[8,50],[9,55],[10,56],[10,56],[10,58],[10,59],[16,128],[20,149],[25,174],[31,202],[39,233],[45,258],[51,279],[56,298],[60,313],[66,332],[69,343],[71,352],[75,366],[77,371],[78,376],[79,381],[81,386],[82,390],[83,395],null],"女":[null,[null,24],[null,28],[null,33],[6,39],[7,44],[8,50],[9,55],[10,56],[10,56],[10,58],[10,59],[14,98],[18,123],[22,150],[27,177],[33,208],[38,238],[45,273],[50,301],[52,315],[56,336],[60,354],[63,373],[67,390],[69,405],[75,433],[80,461],[85,490],[92,525],null,null]},"other":[],"adult":[{"sex":"男女","lo":110,"hi":410}],"adultText":"男女とも 110〜410 (mg/dL)（免疫比濁法）"},"ige":{"abbr":"IgE","name":"免疫グロブリンE（非特異的IgE）","unit":"U/mL","page":96,"desc":"アレルギーになりやすい体質かどうかをみる指標である。免疫グロブリンのうち血中量がもっとも少なく、単位はIU/mLやUA/mLを用いる。IgEには総量をみる非特異的IgEと、個々のアレルゲンに向けた特異的IgEの2種がある。","high":"一般的なアレルギー：アレルギー性結膜炎、アレルギー性鼻炎、アトピー型気管支喘息、食物アレルギー、薬剤アレルギー など／著しい高値（1万IU/mLを超えることもある）を示すもの―皮膚：アトピー性皮膚炎／感染：寄生虫感染、HIV感染症、結核／免疫不全・免疫異常：高IgE症候群、Wiskott-Aldrich症候群、木村病／腫瘍：IgE骨髄腫。","low":"免疫不全：毛細血管拡張性運動失調症・重症複合型免疫不全症／ウイルス：HTLV-1感染／喘息：アトピー型でない喘息（大半は感染型）。","note":"データ：日本公衆衛生協会。測定法：EIA。成人値はFEIA。補足：上下限は男女共通で、対象は1〜13歳。原典の表では単位が「U/mL」と記されている。","ser":{"男女":[null,null,null,null,null,null,null,null,null,null,null,null,[5.4,1100],[6.7,1400],[8.4,1800],[9.9,2200],[12,2700],[12,2900],[13,3100],[13,2900],[13,2900],[12,2800],[12,2700],[11,2600],[11,2600],null,null,null,null,null,null,null]},"other":[],"adult":[{"sex":"男女","lo":null,"hi":173}],"adultText":"男女とも 173以下 (IU/mL)（FEIA）"},"ige_allergy":{"abbr":"IgE/特異的IgE","name":"IgEの考え方とアレルギー関連検査","unit":null,"page":98,"desc":"特異的IgE抗体こそが、好酸球・好塩基球・マスト細胞の表面のIgE受容体へ結びつく。素因としてアレルギーを起こしやすいかどうかは非特異的IgEで、特異的IgEはどのアレルゲンに対するIgEがどれだけあるかを示す。","high":null,"low":null,"note":"基準値の表はない。補足：非特異的IgEの濃度は重症度と一致するとは限らず、臨床像と照らすときは対数で考える。特異的IgEは偽陽性が少なくなく、スギ特異的IgEが陽性でも30〜50%は症状がない（食物アレルギーでも同じ傾向）。特異的IgEの結果は皮膚テスト（スクラッチテスト・プリックテスト）とおおむね一致する。関連検査の説明：リンパ球幼若化反応（T細胞・B細胞機能の評価、薬剤アレルギーの原因薬の特定）、ルーチンでは行わないヒスタミン遊離テスト、ECP（活性化した好酸球を示すマーカー）。","ser":{},"other":[],"adult":[],"adultText":null},"igg":{"abbr":"IgG","name":"免疫グロブリンG","unit":"mg/dL","page":100,"desc":"胎生16〜20週に脾臓にリンパ球が出現した後、IgMの次に作られ始める免疫グロブリンである。胎盤を通って母体から移行するため新生児では高く、生後4〜8か月でいったん下がってから再び増えていく。","high":"免疫の病気：膠原病などの自己免疫疾患／感染：感染症。","low":"先天性免疫不全：ブルトン型無ガンマグロブリン血症・重症複合型免疫不全症・IgG欠損症／乳児期に一時的なもの：乳児一過性低ガンマグロブリン血症。","note":"データ：日本公衆衛生協会。測定法：ラテックス凝集免疫測定法（成人は免疫比濁法）。補足：上下限を性別ごとに示す。1〜11か月は男女で同じ値。女児は18歳までで19歳はデータなし。","ser":{"男":[null,[400,1030],[290,960],[290,960],[300,960],[290,960],[290,950],[300,960],[340,1000],[360,1010],[380,1020],[380,1020],[460,1220],[500,1280],[530,1340],[560,1390],[600,1450],[630,1490],[660,1540],[690,1570],[700,1600],[720,1620],[740,1640],[750,1660],[760,1670],[760,1680],[770,1690],[780,1700],[780,1710],[790,1720],[800,1720],null],"女":[null,[400,1030],[290,960],[290,960],[300,960],[290,960],[290,950],[300,960],[340,1000],[360,1010],[380,1020],[380,1020],[470,1210],[500,1280],[540,1340],[570,1400],[610,1470],[650,1530],[680,1580],[710,1620],[730,1650],[760,1690],[780,1730],[790,1740],[800,1760],[810,1780],[820,1800],[830,1810],[840,1830],[860,1850],null,null]},"other":[],"adult":[{"sex":"男女","lo":870,"hi":1700}],"adultText":"男女とも 870〜1700 (mg/dL)（免疫比濁法）"},"igm":{"abbr":"IgM","name":"免疫グロブリンM","unit":"mg/dL","page":102,"desc":"胎生16〜20週に、免疫グロブリンの中で一番先に作られ始める。胎盤をほぼ通らないので、新生児で高ければ子宮内（母体内）での感染を疑う手がかりとなる。","high":"新生児：出生時に高い場合は母体内感染／免疫の病気：自己免疫疾患、低ガンマグロブリン血症（高IgM血症を伴う型）／感染：感染症。","low":"先天性免疫不全：Wiskott-Aldrich症候群、IgM欠損症、重症複合型免疫不全症／蛋白喪失：蛋白漏出性胃腸炎。","note":"データ：日本公衆衛生協会。測定法：ラテックス凝集免疫測定法（成人は免疫比濁法）。補足：上下限を性別ごとに示す。1〜11か月は男女で同じ値。女児は18歳までで19歳はデータなし。","ser":{"男":[null,[21,96],[26,112],[30,127],[36,146],[41,161],[46,176],[51,188],[53,195],[55,200],[56,204],[58,209],[57,260],[60,270],[63,279],[66,288],[69,298],[72,305],[73,310],[74,313],[74,312],[74,311],[73,310],[72,306],[70,301],[69,296],[67,291],[65,285],[63,279],[61,274],[59,268],null],"女":[null,[21,96],[26,112],[30,127],[36,146],[41,161],[46,176],[51,188],[53,195],[55,200],[56,204],[58,209],[81,314],[84,323],[86,332],[89,341],[90,346],[92,353],[96,364],[97,370],[97,370],[99,375],[100,381],[100,380],[100,378],[100,379],[99,375],[97,370],[96,365],[95,362],null,null]},"other":[],"adult":[{"sex":"男","lo":33,"hi":190},{"sex":"女","lo":46,"hi":260}],"adultText":"男 33〜190 女 46〜260 (mg/dL)（免疫比濁法）"},"ana":{"abbr":"ANA","name":"抗核抗体","unit":null,"page":104,"desc":"細胞核に含まれる核酸や核蛋白質を標的とする自己抗体をまとめて呼ぶ名称である。染色したときに見える染まり方のパターンで分類する。","high":"陽性になるもの―膠原病：小児SLE（陽性率が高い）・強皮症・若年性関節リウマチ など／感染症：肝炎などのウイルス感染でも陽性化しうる。","low":null,"note":"基準値の表はない。補足：膠原病を疑ったら必ず実施するスクリーニングだが、これだけで膠原病と診断はせず、抗DNA抗体などと組み合わせる。蛍光法での染色パターンと対応する抗原：①均質型＝抗ヒストン抗体（LE細胞、LEテスト）、②辺縁型（シャギー型）＝抗DNA抗体（RI法またはELISA法で測定）、③斑紋型＝ENAをはじめヒストン以外の核蛋白を標的とする抗体（抗SS-B、抗SS-A、抗U1-RNP、抗Sm、抗Scl-70＝抗トポイソメラーゼI）、④核小体型＝抗リボゾーム、抗RNAポリメラーゼ、抗U3-RNPなど、⑤散在斑点型＝抗セントロメア抗体、⑥PCNA型＝抗PCNA抗体（判定で斑紋型と取り違えやすい）。","ser":{},"other":[],"adult":[],"adultText":null},"tarc":{"abbr":"TARC","name":"thymus and activation-regulated chemokine","unit":"pg/mL","page":106,"desc":"CCR4（ケモカイン受容体の一つで、Th2細胞に限って発現）へ選択的に結合するリガンドである。アトピー性皮膚炎で高くなり、その時点の（急性の）炎症の強さを敏感に映すため、短期の病勢評価に向く。","high":"皮膚：アトピー性皮膚炎（数値が重症度の目安になる）。","low":null,"note":"データ：藤沢隆夫ら、日本小児アレルギー学会誌19:744-757,2005。補足：上限のみで男女共通、年齢は3区分。6〜12か月と1〜2歳は「未満」と表記され、2歳以上は「743」の数値だけで「未満」の記載がない。成人はRIA抗体法で測り、単位がng/mL（基準0.8以下）と異なる。","ser":{"男女":[null,null,null,null,null,null,[null,1367],[null,1367],[null,1367],[null,1367],[null,1367],[null,1367],[null,998],[null,743],[null,743],[null,743],[null,743],[null,743],[null,743],[null,743],[null,743],[null,743],[null,743],[null,743],[null,743],[null,743],[null,743],[null,743],[null,743],[null,743],[null,743],[null,743]]},"other":[],"adult":[{"sex":"男女","lo":null,"hi":0.8,"unit":"ng/mL"}],"adultText":"男女とも 0.8以下 (ng/mL)（RIA抗体法）"},"gh":{"abbr":"GH","name":"成長ホルモン","unit":"ng/mL","page":108,"desc":"子どもの成長を担う中心的なホルモンで、分泌の山は夜間、入眠後1〜3時間にくる。1日の中での変動が大きく、食事・運動・ストレスでも値が動くため、単回の基礎値だけでは診断にほぼ使えない。評価には分泌刺激試験・抑制試験といった負荷試験が必要になる。","high":"下垂体の病気：下垂体性巨人症","low":"成長の障害：成長ホルモン分泌不全性低身長症","note":"データ：日本公衆衛生協会。測定法：IRMA。補足：1〜17歳について年齢ごとに下限と上限を示す。","ser":{"男":[null,null,null,null,null,null,null,null,null,null,null,null,[0.17,31.3],[0.14,28.2],[0.12,26.2],[0.11,24.6],[0.1,23.2],[0.08,21.3],[0.08,20.5],[0.07,19.7],[0.07,19.5],[0.08,20.8],[0.09,21.7],[0.09,21.5],[0.08,20.8],[0.08,20.4],[0.08,19.9],[0.07,19.3],[0.07,18.7],null,null,null],"女":[null,null,null,null,null,null,null,null,null,null,null,null,[0.18,24.3],[0.17,23.7],[0.16,23.1],[0.15,22.5],[0.15,21.9],[0.14,21.4],[0.15,21.8],[0.16,22.9],[0.17,24.1],[0.21,26.6],[0.27,31 sc":"思春期の男子ではLHに刺激されて精巣のLeydig細胞が分泌し、副腎や卵巣からも一部出る。二次性徴を進めるとともに蛋白同化にも働く。思春期の初めは夜間〜朝に分泌が集中するので、採血は午前中に行うのがよい。","high":"中枢が原因：中枢性思春期早発症（目安：9歳未満で精巣容量が4mL以上に増え、かつ日中の値が30ng/dL以上）／末梢が原因：末梢性思春期早発症","low":"思春期の遅れ：思春期遅発症／性腺の機能不全：性腺機能低下症（目安：14歳を過ぎても精巣が大きくならず、値が10ng/dL以下）","note":"データ：日本公衆衛生協会。測定法：RIA（固相法）。補足：年齢ごとの下限・上限。下限の記載がない「—」はnullとした。原表が空欄の男8・9歳と女18歳は行を設けていない。別枠の参考値（男10歳以上、Tanner段階別の平均±1SD、測定法が異なり症例数も少ない）はseries「男(参考値)」へ範囲の形で収めた。","ser":{"男":[null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,[null,317],[null,413],[null,513],[24.6,615],[79.4,700],[125,767],[174,844],[191,871],[208,899],null,null],"女":[null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,[null,30.3],[null,36.8],[null,44.3],[null,52.9],[5.0,63.2],[7.4,70.3],[9.4,76.2],[9.4,76.2],[9.6,77.1],[10.1,78.5],null,null,null]},"other":[{"sex":"男","age":"Tanner II 参考値 平均±1SD（10歳以降）","lo":35.8,"hi":109.0,"mid":null},{"sex":"男","age":"Tanner III 参考値 平均±1SD（10歳以降）","lo":80.2,"hi":177.2,"mid":null},{"sex":"男","age":"Tanner IV 参考値 平均±1SD（10歳以降）","lo":106.0,"hi":311.0,"mid":null}],"adult":[{"sex":"男","lo":1.31,"hi":8.71,"unit":"ng/mL"},{"sex":"女","lo":0.11,"hi":0.47,"unit":"ng/mL"}],"adultText":"ECLIA 男 1.31〜8.71 女 0.11〜0.47 (ng/mL) ※成人は単位がng/mL（小児表はng/dL）"},"estradiol":{"abbr":"E2","name":"エストラジオール","unit":"pg/mL","page":122,"desc":"卵胞ホルモンの中で作用が最も強い。女子では主にゴナドトロピンに刺激された卵胞で、アロマターゼがテストステロンを変換して作られる（男子でもわずかながら副腎・精巣由来のものがある）。思春期には乳房と子宮を発育させ、それ以降は月経周期に沿って値が上下する。","high":"性早熟：思春期早発症（目安：女子で7歳6カ月より前に乳房が発育し、値が15pg/mL以上）","low":"思春期の遅れ：思春期遅発症／性腺の機能不全：性腺機能低下症（目安：13歳以降も二次性徴がみられず、値が10pg/mL以下）","note":"データ：日本公衆衛生協会。測定法：RIA（固相法）。補足：年齢ごとの下限・上限。下限の記載がない「—」はnullとした。原表が空欄の男11・12歳と女18歳は行を省く。前思春期の値は測定感度未満。","ser":{"男":[null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,[null,37.2],[null,43.5],[null,51.2],[null,51.3],[null,50.1],[null,43.1],null,null],"女":[null,null,null,null,null,n ,"hi":3.5}],"adultText":"抽出後RIA 男 0.6〜3.0 女 0.2〜1.0（卵胞期）、0.5〜3.5（黄体期）(ng/mL)"},"tsh":{"abbr":"TSH","name":"甲状腺刺激ホルモン","unit":"μIU/mL","page":126,"desc":"TRHの刺激で下垂体から放出され、甲状腺にホルモンを作らせ分泌させる。遊離甲状腺ホルモンによる負のフィードバックに敏感に反応するので、甲状腺機能を判断するのに役立つ。昼に低く夜に高い、軽い日内変動がある。","high":"甲状腺の働きが落ちている：原発性甲状腺機能低下症。代償された段階ならおよそ6〜10程度にとどまる","low":"甲状腺の働きが過剰：原発性甲状腺機能亢進症。測定感度未満まで下がる","note":"データ：日本公衆衛生協会。測定法：IRMA。補足：1〜11か月は月齢ごと（男女共通）、それ以降は年齢ごと（男1〜19歳、女1〜17歳）に下限・上限を示す。原表の単位はμU/mLと表記。","ser":{"男":[null,[0.77,7.3],[0.68,6.5],[0.6,5.8],[0.55,5.4],[0.5,5.0],[0.45,4.5],[0.43,4.4],[0.41,4.2],[0.42,4.3],[0.41,4.1],[0.39,4.0],[0.44,4.1],[0.43,4.0],[0.43,4.0],[0.43,4.0],[0.43,4.0],[0.43,4.0],[0.44,4.1],[0.46,4.3],[0.46,4.4],[0.46,4.3],[0.46,4.3],[0.45,4.2],[0.45,4.3],[0.44,4.1],[0.42,3.9],[0.41,3.7],[0.4,3.6],[0.39,3.5],[0.37,3.3],null],"女":[null,[0.77,7.3],[0.68,6.5],[0.6,5.8],[0.55,5.4],[0.5,5.0],[0.45,4.5],[0.43,4.4],[0.41,4.2],[0.42,4.3],[0.41,4.1],[0.39,4.0],[0.31,4.0],[0.31,4.0],[0.31,4.0],[0.31,3.9],[0.31,3.9],[0.31,4.0],[0.32,4.0],[0.33,4.1],[0.33,4.2],[0.34,4.2],[0.33,4.1],[0.32,4.0],[0.31,4.0],[0.29,3.8],[0.28,3.6],[0.26,3.5],[0.24,3.3],null,null,null]},"other":[],"adult":[{"sex":"男女","lo":0.5,"hi":5.0}],"adultText":"ECLIA 男女とも 0.500〜5.00 (μIU/mL)"},"ft3":{"abbr":"FT3","name":"遊離トリヨードサイロニン","unit":"pg/mL","page":128,"desc":"T3の多くは末梢組織でT4からヨウ素が外れて作られる。血中ではほとんどが蛋白と結合しており、生物学的に働くのは約0.3%の遊離型である。解釈はTSH、free T4の値とセットで行う。","high":"ホルモン過剰：甲状腺機能亢進症","low":"ホルモン不足：甲状腺機能低下症","note":"データ：日本公衆衛生協会。測定法：RIA（固相法）。補足：年齢ごとの下限・上限（男1〜19歳、女1〜17歳）。本文では、小児なら臨床上5.0pg/mLまでは正常とみてよいとしている。","ser":{"男":[null,null,null,null,null,null,null,null,null,null,null,null,[2.28,4.56],[2.29,4.58],[2.31,4.59],[2.32,4.6],[2.34,4.62],[2.37,4.65],[2.4,4.68],[2.43,4.71],[2.5,4.77],[2.53,4.81],[2.56,4.84],[2.56,4.84],[2.53,4.81],[2.46,4.74],[2.39,4.67],[2.32,4.6],[2.25,4.53],[2.2,4.49],[2.13,4.42],null],"女":[null,null,null,null,null,null,null,null,null,null,null,null,[2.32,4.38],[2.29,4.35],[2.23,4.3],[2.29,4.35],[2.39,4.45],[2.45,4.5],[2.49,4.54],[2.51,4.56],[2.54,4.59],[2.53,4.57],[2.48,4.53],[2.43,4.48],[2.38,4.43],[2.33,4.38],[2.28,4.34],[2.23,4.29],[2.19,4.25],null,null,null]},"other":[],"adult":[{"sex":"男女","lo":2.3,"hi":4.3}],"adultText":"ECLIA 男女とも 2.30〜4.30 (pg/mL)"},"ft4":{"abbr":"FT4","name":"遊離サイロキシン","unit":"ng/dL","page":130,"desc":"甲状腺から分泌されるサイロキシンで、その約80%は末梢で脱ヨード化されてT3に変わる。血中ではほとんどがTBGに結合しており、活性をもつ遊離型は0.02〜0.03%にすぎない。","high":"ホルモン過剰：甲状腺機能亢進症","low":"ホルモン不足：甲状腺機能低下症（甲状腺が原因ならTSHは上昇、中枢が原因ならTSHは低下）","note":"データ：日本公衆衛生協会。測定法：RIA（固相法）。補足：年齢ごとの下限・上限（男1〜19歳、女1〜17歳）。","ser":{"男":[null,null,null,null,null,null,null,null,null,null,null,null,[0.99,1.91],[1.0,1.93],[1.0,1.95],[1.01,1.97],[1.02,1.99],[1.03,2.0],[1.03,2.0],[1.03,2.0],[1.02,1.99],[1.01,1.96],[1.01,1.96],[1.0,1.95],[0.99,1.92],[0.98,1.91],[0.98,1.9],[0.98,1.89],[0.97,1.89],[0.97,1.88],[0.97,1.87],null],"女":[null,null,null,null,null,null,null,null,null,null,null,null,[0.99,1.9],[1.0,1.93],[1.01,1.95],[1.03,1.98],[1.04,2.01],[1.05,2.02],[1.04,2.01],[1.04,2.01],[1.03,1.98],[1.01,1.95],[1.0,1.93],[0.98,1.9],[0.97,1.87],[0.96,1.85],[0.95,1.83],[0.94,1.81],[0.93,1.79],null,null,null]},"other":[],"adult":[{"sex":"男女","lo":0.9,"hi":1.7}],"adultText":"ECLIA 男女とも 0.90〜1.70 (ng/dL)"},"insulin":{"abbr":"IRI","name":"インスリン","unit":"μIU/mL","page":132,"desc":"免疫学的測定法で測るので、IRIと呼ばれる。値は血糖に連動して動くため、必ず同じ採血で血糖も測り、両者を突き合わせて解釈する。","high":"低血糖を起こす病態：高インスリン血性低血糖症。血糖が下がっている時点でIRIが2〜5μIU/mLを上回るなら診断できる","low":"糖尿病：1型（基礎値の段階で低いことが多い）、2型（糖負荷をかけると低さがはっきりする）","note":"補足：表はなく、本文に空腹時の基準範囲として5〜15μIU/mLが示されるのみで、年齢・性別の区分はない。HOMA-R＝空腹時血糖(mg/dL)×IRI(μIU/mL)÷405 で求め、4以上ならインスリン抵抗性ありとみなすことが多い。","ser":{},"other":[{"sex":"男女","age":"空腹時","lo":5,"hi":15,"mid":null}],"adult":[],"adultText":"成人の基準値の別記載なし（空腹時5〜15μIU/mL、本文）"},"pth_intact":{"abbr":"intact PTH","name":"副甲状腺ホルモン（intact PTH）","unit":"pg/mL","page":133,"desc":"副甲状腺主細胞は血中イオン化Caが下がるのを感知してPTHを出す。PTHは骨吸収を進め、腎ではCaの尿中排泄を抑えてリンの排泄を増やし、さらにビタミンDを活性化して、結果として血中Caを引き上げる。判断には血清Ca・P・Mgを一緒に見る。","high":"血中Caが高い場合：原発性副甲状腺機能亢進症／血中Caが低い〜正常の場合：続発性副甲状腺機能亢進症（原因はビタミンD欠乏症・ビタミンD依存症・慢性腎不全）、偽性副甲状腺機能低下症","low":"血中Caが正常〜高い場合：Caの過剰投与、ビタミンA中毒、ビタミンD中毒、悪性腫瘍に伴う高Ca血症／血中Caが低い場合：続発性副甲状腺機能低下症（甲状腺手術後・X線照射後）、副甲状腺機能低下症","note":"データ：Osteoporosis Japan 12:449-456, 2004。測定法：ECLIA。補足：表はなく、小児と成人に同じ範囲を1つ用いる（小児の基準値は成人とほとんど変わらない）。","ser":{},"other":[],"adult":[{"sex":"男女","lo":10,"hi":65}],"adultText":"小児・成人 intact PTH 10〜65 pg/mL"},"pth_whole":{"abbr":"whole PTH","name":"副甲状腺ホルモン（whole PTH）","unit":"pg/mL","page":133,"desc":"副甲状腺主細胞は血中イオン化Caが下がるのを感知してPTHを出す。PTHは骨吸収を進め、腎ではCaの尿中排泄を抑えてリンの排泄を増やし、さらにビタミンDを活性化して、結果として血中Caを引き上げる。判断には血清Ca・P・Mgを一緒に見る。whole PTHは完全長のPTH(1-84)だけを測るため、値はintact PTHの約60%になる。","high":"血中Caが高い場合：原発性副甲状腺機能亢進症／血中Caが低い〜正常の場合：続発性副甲状腺機能亢進症（原因はビタミンD欠乏症・ビタミンD依存症・慢性腎不全）、偽性副甲状腺機能低下症","low":"血中Caが正常〜高い場合：Caの過剰投与、ビタミンA中毒、ビタミンD中毒、悪性腫瘍に伴う高Ca血症／血中Caが低い場合：続発性副甲状腺機能低下症（甲状腺手術後・X線照射後）、副甲状腺機能低下症","note":"データ：医学と薬学 48:243-247, 2002。測定法：RIA固相法(IRMA)。補足：表はなく、小児と成人で共通の範囲を1つ用いる。","ser":{},"other":[],"adult":[{"sex":"男女","lo":9,"hi":39}],"adultText":"小児・成人 whole PTH 9〜39 pg/mL"},"renin":{"abbr":"PRA","name":"レニン（血漿レニン活性）","unit":"ng/mL/hr","page":135,"desc":"レニンはレニン基質を切ってアンギオテンシンIを作り、これがアンギオテンシンIIに変わることでアルドステロン分泌が高まる。分泌のきっかけは腎動脈の血圧低下と尿細管腔内のNa減少である。新生児の値は成人の1桁上で、6歳頃までに成人の値へ近づいていく。","high":"血圧が正常：バーター症候群、塩喪失型副腎皮質過形成、偽性低アルドステロン症など／血圧が高い：腎血管性高血圧など","low":"血圧が高い：原発性アルドステロン症、高血圧を伴う副腎皮質過形成など／血圧が正常：小児ではまれだが低レニン性低アルドステロン症","note":"測定法：RIA2抗体法。補足：表はなく、本文に示されるのは成人値だけで、小児の年齢別の値はない（新生児は1桁高く、6歳頃までに成人値へ近づく）。","ser":{},"other":[],"adult":[{"sex":"男女","label":"臥位","lo":0.3,"hi":2.9},{"sex":"男女","label":"立位","lo":0.3,"hi":5.4}],"adultText":"血漿レニン活性 成人 臥位0.3〜2.9ng/mL/hr、立位0.3〜5.4ng/mL/hr（RIA2抗体法）"},"aldosterone":{"abbr":"アルドステロン","name":"アルドステロン","unit":"pg/mL","page":135,"desc":"副腎皮質球状層で作られ、腎集合管でNaを再吸収させ、KとH+を排泄させる。分泌の刺激となるのは、血清Kが高いこととレニン・アンギオテンシン系の働きである。新生児の値は成人の1桁上で、6歳頃までに成人並みになっていく。","high":"血圧が正常：レニンが高い→バーター症候群、塩喪失型副腎皮質過形成、偽性低アルドステロン症など／血圧が高い：レニンが高い→腎血管性高血圧など、レニンが低い→高血圧を伴う副腎皮質過形成、原発性アルドステロン症など","low":"レニンも低い場合：低レニン性の低アルドステロン症などが該当","note":"測定法：RIA固相法 function vnTrack(sc){
  if(sc===STORY.prologue)return"morning";

  if(Object.values(STORY.close).includes(sc))return"dawn";
  const p=(sc.chap&&sc.chap.place)||"";

function playStory(sc){
  return new Promise(done=>{
    if(!sc||vnBusy){done();return}
    vnBusy=true;VN_TRACK=sc.bgm||vnTrack(sc);bgm();
    if(!vnEl){vnEl=document.createElement("div");vnEl.className="vn";document.body.appendChild(vnEl)}
    vnEl.innerHTML=`<div class="vn-bd" style="background-image:url(${IMG(sc.cg)}),url(${IMG("bg_lab","jpg")})"></div><div class="vn-cg" style="background-image:url(${IMG(sc.cg)}),url(${IMG("bg_lab","jpg")})"></div>
      ${sc.chap?`<div class="vn-chap"><div class="tm">${[sc.chap.time,esc(sc.chap.place)].filter(Boolean).join("　")}</div><div class="tt">${esc(sc.chap.title)}</div></div>`:""}
      <div class="vn-box"><div class="vn-name" hidden></div><div class="vn-text"></div><div class="vn-next">▼ タップで次へ</div></div>
      <button class="vn-skip" type="button">スキップ ▶▶</button>`;
    vnEl.hidden=false;
    const box=vnEl.querySelector(".vn-text"),nm=vnEl.querySelector(".vn-name"),chap=vnEl.querySelector(".vn-chap");
    let i=-1,full=true,timer=null,cur="";
    const close=()=>{clearInterval(timer);vnEl.hidden=true;vnBusy=false;VN_TRACK=null;bgm();document.removeEventListener("keydown",onKey);done()};
    const show=()=>{
      i++;if(i>=sc.lines.length){close();return}
      const [spk,txt]=sc.lines[i],name=VN_NAME[spk]!=null?VN_NAME[spk]:spk,face=vnFace(spk);
      nm.hidden=!name;nm.innerHTML=name?`${face?`<span class="vf"><img src="${face}" alt="" onerror="this.parentNode.remove()"></span>`:""}${esc(name)}`:"";
      box.classList.toggle("narr",spk==="n");cur=txt;
      const tmp=document.createElement("div");tmp.innerHTML=txt;const plain=tmp.textContent;let k=0;
      if(RM){box.innerHTML=txt;full=true;return}
      full=false;box.textContent="";clearInterval(timer);
      timer=setInterval(()=>{k+=2;if(k>=plain.length){clearInterval(timer);box.innerHTML=cur;full=true}else box.textContent=plain.slice(0,k)},28);
    };
    const step=()=>{
      if(chap&&!chap.hidden){chap.classList.add("out");setTimeout(()=>{chap.hidden=true},280);show();return}
      if(!full){clearInterval(timer);box.innerHTML=cur;full=true;return}
      sfx("tap");show();
    };
    const onKey=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();step()}else if(e.key==="Escape")close()};
    vnEl.onclick=step;document.addEventListener("keydown",onKey);
    vnEl.querySelector(".vn-skip").onclick=e=>{e.stopPropagation();close()};
    if(chap){setTimeout(()=>{if(!chap.hidden&&vnEl.contains(chap))step()},RM?0:1900)}else show();
  });
}

function nextLabel(st,c){return{intro:c.noOrder?"結果票を見る":"採血へ",order:"遠心する",inspect:"結果票へ",results:"しくみを触る",widget:"判読へ",ev:"次へ",quiz:"次へ"}[st.t]||"次へ"}
function canNext(c,st){
  const cs=S.cs;
  if(st.t==="order")return cs.orderDone;

  if(st.t==="ev")return cs.evDone;

  return true;
}

function orderVol(cs){const t=new Set([...cs.order].map(k=>TEST_BY[k].t));return[...t].reduce((a,x)=>a+TUBES[x].vol,0)}
function stOrder(c){
  const cs=S.cs,o=c.order,vol=orderVol(cs),circ=c.pt.wt*80,pct=vol/circ*100,scaleMax=Math.max(2,pct*1.2);
  const used=["edta","cit","sst","naf","gas","bc"].filter(t=>[...cs.order].some(k=>TEST_BY[k].t===t));
  const rack=used.length?used.map((t,i)=>`<g transform="translate(${8+i*64},4)"><svg width="56" height="150" viewBox="0 0 56 150">${tubeSVG(t,"whole","r"+i).replace(/<svg[^>]*>|<\/svg>/g,"")}</svg></g>`).join(""):`<text x="200" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#A4A6C2">検査を選ぶと、ここに採血管が並びます</text>`;
  const verdict=k=>o.req.includes(k)?"req":o.rec.includes(k)?"rec":o.neutral.includes(k)?"neu":"bad";
  const tests=TESTS.map(t=>{
    const on=cs.order.has(t.k);let cls="";
    if(cs.orderDone){const v=verdict(t.k);if(on&&v==="bad")cls="v-bad";else if(v==="req")cls="v-req"}
    return`<button class="test ${cls}" style="--cap:${capVar(t.t)}" data-act="toggleTest" data-v="${t.k}" aria-pressed="${on}" ${cs.orderDone?"disabled":""}><img class="ticon" src="${IMG("icon_"+TEST_CAT[t.k])}" alt="" onerror="this.remove()"><span class="dot"></span><span><b>${esc(t.n)}</b><span>${TUBES[t.t].short}・${TUBES[t.t].name}</span></span></button>`}).join("");
  let fb;
  if(cs.orderDone){
    const lines=[];
    o.req.forEach(k=>lines.push(["g","◎",TEST_BY[k].n,o.why[k]]));
    o.rec.forEach(k=>lines.push([cs.order.has(k)?"g":"n",cs.order.has(k)?"○":"－",TEST_BY[k].n+(cs.order.has(k)?"":"（選ぶとよかった）"),o.why[k]]));
    [...cs.order].filter(k=>verdict(k)==="neu").forEach(k=>lines.push(["n","△",TEST_BY[k].n,o.why[k]||"今回はどちらでもよい検査です。"]));
    [...cs.order].filter(k=>verdict(k)==="bad").forEach(k=>lines.push(["b","×",TEST_BY[k].n,"今回の症状からは必要性が低い検査です。小さな子では採血量と痛みの負担も考えます。"]));
    const p=cs.pts.order;
    fb=coach(p>=25?"happy":"think",`オーダー確定！ <span class="score">${p} / 30</span><div class="verdicts" style="margin-top:8px">${lines.map(l=>`<div class="verdict"><span class="m ${l[0]}">${l[1]}</span><span><b>${esc(l[2])}</b>　${esc(l[3])}</span></div>`).join("")}</div>`,p>=25?"ok":"","採点");
    fb+=nurse("happy",`採血、行ってきます！ 採血管は <b class="num">${new Set([...cs.order].map(k=>TEST_BY[k].t)).size}</b> 本、合計 <b class="num">${vol.toFixed(1)}</b> mL ですね。`);
  }else if(cs.orderMsg){
    fb=coach("alert",esc(cs.orderMsg),"ng","まだ足りない");
  }else{
    fb=coach("think",`${esc(c.pt.name)}に必要な検査を選んでください。選びすぎると減点、必須の検査が抜けていると確定できません。`);
  }
  return`<div class="sheet stack">
    <div class="rack"><svg viewBox="0 0 400 158" role="img" aria-label="選んだ採血管">${rack}</svg></div>
    ${used.length?`<div class="note">${used.map(t=>`<div><b style="color:${capVar(t)}">●</b> <b>${TUBES[t].short}</b> ${TUBES[t].name}（${TUBES[t].vol} mL）：${TUBES[t].what}</div>`).join("")}</div>`:""}
    <div><div class="row" style="justify-content:space-between"><span class="lbl">採血量</span><span><b class="num" style="font-size:22px">${vol.toFixed(1)}</b> mL <span class="note">／ 循環血液量の <span class="num">${pct.toFixed(2)}</span>%</span></span></div>
    <div class="vol-bar"><i style="width:${Math.min(100,pct/scaleMax*100)}%"></i><em style="left:${1/scaleMax*100}%"></em></div>
    <p class="note">縦の線が循環血液量の1%。新生児や乳児では、くり返す採血だけで貧血になることがあります。</p></div>
  </div>
  <div class="sheet stack"><div class="lbl">検査を選ぶ</div><div class="tests">${tests}</div>
    ${cs.orderDone?"":`<button class="btn solid" data-act="submitOrder" ${cs.order.size?"":"disabled"}>オーダーを確定</button>`}</div>
  ${fb}`;
}

function stInspect(c){
  const cs=S.cs;
  const used=["edta","cit","sst","naf","gas","bc"].filter(t=>[...cs.order].some(k=>TEST_BY[k].t===t));
  if(!cs.spun){
    return`<div class="sheet"><div class="cf"><svg viewBox="0 0 180 180" aria-label="遠心分離中"><circle cx="90" cy="90" r="84" fill="#F3EEF8" stroke="#2E2545" stroke-width="3"/><g class="rotor"><circle cx="90" cy="90" r="60" fill="none" stroke="#C3B4D6" stroke-width="3"/>${[0,90,180,270].map(a=>`<rect x="83" y="22" width="14" height="36" rx="5" fill="var(--cells)" stroke="#2E2545" stroke-width="2" transform="rotate(${a} 90 90)"/>`).join("")}<circle cx="90" cy="90" r="11" fill="#2E2545"/></g></svg><p class="note">遠心分離中… 3000回転で約10分（ゲームでは一瞬）</p></div></div>`;
  }
  const bad=c.inspect.bad,pick=cs.inspect;
  const stateOf=t=>t==="edta"?"whole":(t===bad?(bad==="sst"?"hemo":"under"):"sep");
  const tb=used.map((t,i)=>{let cls="";if(pick){if(t===bad)cls="right";else if(pick===t)cls="wrong"}
    return`<button class="tube-btn ${cls}" data-act="pickTube" data-v="${t}" ${pick?"disabled":""}>${tubeSVG(t,stateOf(t),"i"+i)}<span>${TUBES[t].short}<br>${TUBES[t].name}</span></button>`}).join("");
  let fb;
  if(pick){
    const right=(bad===null&&pick==="none")||pick===bad;
    const msg=bad===null?c.inspect.ok:(right?c.inspect.why:c.inspect.miss);
    fb=coach(right?"happy":"alert",`${right?"よく見ました！ <span class=\"score\">15点</span><br>":"見逃しました。<br>"}${esc(msg)}`,right?"ok":"ng");
    if(bad!==null)fb+=nurse(right?"alert":"think",right?"ごめんなさい、すぐ再採血に行ってきます！ 次はもっと気をつけますね。":"あっ、私も見落としていました……。再採血に行ってきます。");
  }else fb=nurse("normal","先生、遠心が終わったので並べておきました！ <b>そのまま測ると結果がゆがむ検体</b>があればタップしてください。なければ「すべて問題なし」を。");
  return`<div class="sheet stack"><div class="tubes">${tb}</div>
    <button class="btn" data-act="pickTube" data-v="none" ${pick?"disabled":""}>すべて問題なし</button>
    <div class="tipbox"><b>見るポイント</b>　血清の色（赤い＝溶血、濃い黄色＝黄疸、白く濁る＝乳び）、凝固検査の管の液面（線まで入っているか）、血液ガスに気泡がないか。</div></div>
  ${fb}`;
}

function rangeBar(r){
  if(r.text)return`<div class="rbar note" style="height:auto">${esc(r.v)}</div>`;
  const vals=[r.v,...r.ped,...r.ad];
  let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo)*.12||1;lo=Math.max(0,lo-pad);hi=hi+pad;
  const P=x=>((x-lo)/(hi-lo)*100).toFixed(2);
  const f=flagOf(r,S.cs.ruler),cur=S.cs.ruler==="ped"?r.ped:r.ad;
  return`<span class="rbar"><span class="track"></span><span class="band ped" style="left:${P(r.ped[0])}%;width:${(P(r.ped[1])-P(r.ped[0])).toFixed(2)}%"></span><span class="band ad" style="left:${P(r.ad[0])}%;width:${(P(r.ad[1])-P(r.ad[0])).toFixed(2)}%"></span><span class="pin ${f}" style="left:${P(r.v)}%"></span><span class="rng">基準 ${fmt(cur[0])}–${fmt(cur[1])}${r.src==="approx"?"（目安）":""}</span></span>`;
}

    <span class="flag ${f}">${f}</span>${rangeBar(r)}</button>${cs.open===r.k?`<div class="rnote">${esc(r.note)}</div>`:""}`}).join("");
  const say=c.noOrder?"これが健診の結果票。いまは<b>おとなの物差し</b>で判定されています。右上で「こども」に切り替えると、H と L がどう変わるかな？"

    ${rr}
    <div class="legend"><span><i style="background:var(--band-ped);border:2px solid var(--ok)"></i>小児の基準範囲（${esc(c.pt.age.split(" ")[0])}）</span><span><i style="background:var(--band-ad);border:2px dashed var(--band-ad-line)"></i>成人の基準範囲</span></div>

  </div>`;

  const py=over?T+8:Y(patient);
  const pdot=patient!=null?`<circle cx="${X(pi)}" cy="${py}" r="7" fill="#E0334F" stroke="#2E2545" stroke-width="2.5"/>${over?`<path d="M${X(pi)-6} ${py-9} L${X(pi)} ${py-17} L${X(pi)+6} ${py-9}Z" fill="#E0334F"/>`:""}<text x="${X(pi)+(pi>24?-11:11)}" y="${py+(over?18:-9)}" text-anchor="${pi>24?"end":"start"}" style="fill:#E0334F;font-weight:800;font-size:12px">${esc(cc?cc.pt.name:"")} ${patient}${over?"（枠外）":""}</text>`:"";
  const inPed=r&&patient!=null&&sc.i===pi?(patient>=(r[0]??-1e9)&&patient<=(r[1]??1e9)):null;
  const sexLbl=sc.sex==="男"?"男児":sc.sex==="女"?"女児":"男女共通";
  b.innerHTML=`<div class="fig"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(A.name)}の年齢別基準範囲">${xt}${yt}${adr}${area}${marker}${pdot}</svg></div>
   <p class="note">緑＝小児の基準範囲（${sexLbl}${d.some(x=>x&&x[2]!=null)?"、点線は中央値":""}）、紫の点線＝成人。横軸は0〜11か月を月ごと、1〜20歳を年ごとに並べています。</p>
   <div class="readouts"><div class="ro"><span>年齢</span><b>${AGE_LABELS[sc.i]}</b></div><div class="ro"><span>小児の基準範囲</span><b>${rng(r)}</b></div><div class="ro"><span>成人${ad&&ad.sex&&ad.sex!=="男女"?"（"+esc(ad.sex)+"）":""}</span><b class="${ad?"":"jp"}">${ad?rng([ad.lo,ad.hi]):adU?rng([ad0.lo,ad0.hi])+" "+esc(ad0.unit):esc(A.adultText||"—")}</b></div><div class="ro"><span>単位</span><b>${esc(A.unit||"")}</b></div></div>
   ${inPed!=null?`<div class="tipbox" style="background:${inPed?"var(--ok-soft)":"var(--blood-soft)"}"><b>${AGE_LABELS[pi]}の物差しで見ると：${inPed?"基準範囲内":"範囲外"}</b></div>`:""}
   ${extra.join("")}`;
}

/* ---------- 判読・確認・まとめ ---------- */
function stEv(c){
  const cs=S.cs,e=c.ev,rows=visibleRows(c);
  const opts=e.opts.map((o,i)=>{let cls="";if(cs.evDone){if(i===e.a)cls="right";else if(cs.evAns===i)cls="wrong"}return`<button class="opt ${cls}" data-act="evAns" data-v="${i}" aria-pressed="${cs.evAns===i}" ${cs.evDone?"disabled":""}>${esc(o)}</button>`}).join("");
  const chips=rows.filter(r=>!r.text).map(r=>{let cls="";const on=cs.evPicks.has(r.k);if(cs.evDone){if(on&&e.ev.includes(r.k))cls="right";else if(on&&!e.evOk.includes(r.k))cls="wrong";else if(!on&&e.ev.includes(r.k))cls="missed"}
    const f=flagOf(r,"ped");return`<button class="evchip ${cls}" data-act="evPick" data-v="${r.k}" aria-pressed="${on}" ${cs.evDone?"disabled":""}>${esc(r.n)} <span class="num">${fmt(r.v)}</span>${f?` <b class="flag ${f}">${f}</b>`:""}</button>`}).join("");
  let fb;
  if(cs.evDone){const ok=cs.evAns===e.a;fb=coach(ok?"happy":"alert",`${ok?"正解！":"おしい。"} <span class="score">${cs.pts.ev} / 30</span><br>${esc(e.exp)}<br><span class="note">緑＝決め手の値、点線＝選びたかった決め手、赤＝この診断の根拠にならない値。</span>`,ok?"ok":"ng","判定")}
  else fb=coach("think","診断を1つ選び、その<b>決め手になる検査値</b>をすべてタップしてから「判定する」を押してください。");
  return`${fb}
  <div class="sheet stack"><div class="lbl">① ${esc(e.q)}</div><div class="opts">${opts}</div></div>
  <div class="sheet stack"><div class="lbl">② 根拠になる検査値（判定は小児の基準）</div><div class="evchips">${chips}</div>
    ${cs.evDone?"":`<button class="btn solid" data-act="evSubmit" ${cs.evAns==null||!cs.evPicks.size?"disabled":""}>判定する</button>`}</div>`;
}
function stQuiz(c,i){
  const q=c.quiz[i],ans=S.cs.quiz[i];
  const opts=q.opts.map((o,j)=>{let cls="";if(ans!=null){if(j===q.a)cls="right";else if(ans===j)cls="wrong"}return`<button class="opt ${cls}" data-act="quiz" data-v="${j}" ${ans!=null?"disabled":""}>${esc(o)}</button>`}).join("");
  return`<div class="sheet stack"><div class="lbl" style="font-size:15px">${esc(q.q)}</div><div class="opts">${opts}</div></div>
   ${ans!=null?coach(ans===q.a?"happy":"alert",`${ans===q.a?"正解！ <span class=\"score\">10点</span>":"ざんねん。"}<br>${esc(q.exp)}`,ans===q.a?"ok":"ng"):""}`;
}
function stSum(c){
  const cs=S.cs,total=Object.values(cs.pts).reduce((a,b)=>a+b,0),max=maxPoints(c),st=starsFor(total,max);
  if(!cs.saved){const prev=PROG[c.id];if(!prev||total>prev.score)PROG[c.id]={score:total,stars:st};cs.saved=true;saveProg();
    setTimeout(()=>celebrate(`${c.code} クリア！ ★${st}`,"chapter"),60);
    if(!seenGet("close:"+c.id)){seenSet("close:"+c.id);setTimeout(()=>playStory(STORY.close[c.id]).then(()=>{if(CASES.every(x=>PROG[x.id])&&!seenGet("epilogue")){seenSet("epilogue");playStory(STORY.epilogue)}}),2600)}}
  const next=CASES[CASES.indexOf(c)+1];
  const parts=[["order","採血オーダー",30],["inspect","検体チェック",15],["ev","判読",30]].filter(x=>cs.pts[x[0]]!=null).map(x=>`${x[1]} <b class="num">${cs.pts[x[0]]}</b>/${x[2]}`).concat(c.quiz.map((_,i)=>`確認${i+1} <b class="num">${cs.pts["q"+i]??0}</b>/10`)).join("　");
  return`<div class="sheet stack"><div class="result-top"><div><div class="big">${total}<span class="num" style="font-size:20px;color:var(--ink-3)"> / ${max}</span></div><div style="font-size:28px">${starStr(st)}</div></div><div class="sumcast">${kidImg(c,"happy","sumkid")}<img src="${ART("doctor_happy")}" alt=""></div></div>
    <p class="note">${parts}</p></div>
  ${coach("happy","おつかれさまでした。今日のポイントを3つ持ち帰りましょう。","ok","まとめ")}
  <div class="sheet"><ol class="takeaways">${c.take.map(t=>`<li>${esc(t)}</li>`).join("")}</ol></div>
  <button class="btn replaybig" data-act="storyEnd" data-v="${c.id}">▶ その後のようす</button>
  <div class="nav"><button class="btn" data-act="open" data-v="${c.id}">もう一度</button><button class="btn solid" data-act="${next?"open":"go"}" data-v="${next?next.id:"home"}">${next?"次の症例へ ›":"一覧へ ›"}</button></div>`;
}

/* ---------- actions ---------- */
const ACT={
  title(){showTitle()},
  go(v){S.view=v;if(v!=="case")S.cid=null;render();scrollTo(0,0)},
  open(v){S.view="case";S.cid=v;S.cs=newCaseState(CASE_BY[v]);{const c=CASE_BY[v];if(c.scope)S.scope={a:c.scope.keys[0],i:c.pt.ageIdx,sex:/女/.test(c.pt.age)?"女":"男"}}try{localStorage.setItem(KEY+":last",v)}catch(e){}render();scrollTo(0,0);if(!seenGet("open:"+v)){seenSet("open:"+v);playStory(STORY.open[v])}},
  story(v){playStory(STORY.open[v])},
  storyEnd(v){playStory(STORY.close[v])},
  prologue(){playStory(STORY.prologue)},
  next(){const c=CASE_BY[S.cid];S.cs.step=Math.min(stepsOf(c).length-1,S.cs.step+1);S.cs.open=null;render();scrollTo(0,0)},
  prev(){S.cs.step=Math.max(0,S.cs.step-1);render();scrollTo(0,0)},
  toggleTest(v){const o=S.cs.order;o.has(v)?o.delete(v):o.add(v);S.cs.orderMsg=null;render()},
  submitOrder(){
    const c=CASE_BY[S.cid],cs=S.cs,o=c.order;
    const miss=o.req.filter(k=>!cs.order.has(k));
    if(miss.length){cs.orderFails++;cs.orderMsg=`必須の検査が${miss.length}つ抜けています。ヒント：${miss.map(k=>o.why[k]).join(" ／ ")}（確定のやり直しは1回5点減点）`;bad();render();return}
    const nb=[...cs.order].filter(k=>!o.req.includes(k)&&!o.rec.includes(k)&&!o.neutral.includes(k)).length;
    const missRec=o.rec.filter(k=>!cs.order.has(k)).length;
    cs.pts.order=Math.max(5,30-5*cs.orderFails-3*nb-2*missRec);
    cs.orderDone=true;cs.orderMsg=null;good();render();
  },
  pickTube(v){const c=CASE_BY[S.cid];if(S.cs.inspect)return;S.cs.inspect=v;const right=(c.inspect.bad===null&&v==="none")||v===c.inspect.bad;S.cs.pts.inspect=right?15:0;right?good():bad();render()},
  ruler(v){S.cs.ruler=v;render()},
  openRow(v){S.cs.open=S.cs.open===v?null:v;render()},
  evAns(v){S.cs.evAns=+v;sfx("click");render()},
  evPick(v){const p=S.cs.evPicks;p.has(v)?p.delete(v):p.add(v);render()},
  evSubmit(){
    const c=CASE_BY[S.cid],cs=S.cs,e=c.ev;
    const hit=e.ev.filter(k=>cs.evPicks.has(k)).length;
    const wrong=[...cs.evPicks].filter(k=>!e.ev.includes(k)&&!e.evOk.includes(k)).length;
    const evp=Math.max(0,Math.round(15*hit/e.ev.length)-5*wrong);
    cs.pts.ev=(cs.evAns===e.a?15:0)+evp;cs.evDone=true;cs.evAns===e.a?good():bad();render();
  },
  quiz(v){const c=CASE_BY[S.cid],st=stepsOf(c)[S.cs.step];if(S.cs.quiz[st.i]!=null)return;S.cs.quiz[st.i]=+v;const ok=+v===c.quiz[st.i].a;S.cs.pts["q"+st.i]=ok?10:0;ok?good():bad();render()},
  gm(v){S.cs.w.gm=v;document.querySelectorAll('[data-act="gm"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));updWidget("gamble")},
  hm(v){S.cs.w.hm=v;document.querySelectorAll('[data-act="hm"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));updWidget("hemo")},
  scopeA(v){S.scope.a=v;document.querySelectorAll('[data-act="scopeA"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));drawScope()},
  scopeG(v){const g=REF.groups.find(x=>x.name===v);S.scope.g=v;S.scope.a=g.keys[0];render()},
  scopeSex(v){S.scope.sex=v;drawScope()}
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t||t.disabled)return;const f=ACT[t.dataset.act];if(f)f(t.dataset.v)});
let lastTick=0;
document.addEventListener("input",e=>{const t=e.target;if(!t.dataset||!t.dataset.in)return;const k=t.dataset.in;
  const now=Date.now();if(now-lastTick>60){lastTick=now;sfx("tick")}
  if(k==="iron"){S.cs.w.iron=+t.value;updWidget("iron")}
  if(k==="crp"){S.cs.w.crp=+t.value;updWidget("crp")}
  if(k==="age"){S.scope.i=+t.value;drawScope()}});

render();
showTitle();
</script>

</body></html>
